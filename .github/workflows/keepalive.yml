# Evita que Supabase (plan gratuito) pause el proyecto por una semana sin actividad:
# hace una consulta real a la API cada 3 días.
name: keepalive-supabase
on:
  schedule:
    - cron: "17 11 */3 * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta a la API de Supabase
        run: |
          curl -fsS --max-time 30 \
            -H "apikey: sb_publishable_cVkWbrGXdP0BxiuGWHBpeg_L0jlT_mt" \
            "https://xlxlvodttebgjkskkkti.supabase.co/rest/v1/areas?select=id&limit=1"
          echo
          echo "OK $(date -u)"
