const hhmm2=t=>String(t).slice(0,5);
const SL={in:'Entrada',bo:'Salida a refrigerio',bi:'Regreso de refrigerio',out:'Salida'};
const propText=p=>Object.entries(p||{}).map(([k,v])=>`${SL[k]||k}: <b>${v||'borrar'}</b>`).join(' · ');
function modal(html){const o=document.createElement('div');o.className='ov';o.id='modal';o.innerHTML='<div>'+html+'</div>';o.addEventListener('click',e=>{if(e.target===o)closeModal()});document.body.appendChild(o)}
const closeModal=()=>{const o=$('#modal');if(o)o.remove()};
const timeInputs=(pre)=>{const mx=window._day.date===todayStr()?nowHM():'';return`<div class="slots">${SLOTS.map(([k,l,f])=>`<label class="slot"><div class="l">${l}</div><input type="time" id="t_${k}" value="${pre&&window._day.r[f]?hhmm(window._day.r[f]):''}" ${mx?`max="${mx}"`:''} style="width:100%"></label>`).join('')}</div>`};
function changedSlots(){const r=window._day.r,o={};SLOTS.forEach(([k,l,f])=>{const v=$('#t_'+k).value,cur=r[f]?hhmm(r[f]):'';if(v!==cur)o[k]=v||null});return o}

const nowHM=()=>new Date().toLocaleTimeString('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false});
function slotReq(k){
 const sl=SLOTS.find(x=>x[0]===k),r=window._day.r,cur=r[sl[2]]?hhmm(r[sl[2]]):'',mx=window._day.date===todayStr()?nowHM():'';
 window._slot=k;
 modal(`<h3>Solicitar cambio: ${sl[1]}</h3><p class="note">${esc(window._day.date)} · Marcaje actual: <b>${cur||'sin marcaje'}</b></p>
 <label>Hora correcta *</label><input type="time" id="rT" value="${cur}" ${mx?`max="${mx}"`:''} style="width:100%">
 <label style="display:block;margin-top:8px">Motivo *</label><input id="rM" maxlength="80" placeholder="Escribe el motivo" style="width:100%">
 <label style="display:block;margin-top:8px">Descripción del motivo *</label><textarea id="rD" placeholder="Cuéntanos qué pasó y por qué la hora es esa"></textarea>
 <div class="err" id="rE"></div><div class="row"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn p" onclick="sendReq()">Enviar solicitud</button></div>`);
}
async function sendReq(){const t=$('#rT').value,m=$('#rM').value.trim(),d=$('#rD').value.trim(),date=window._day.date;
 if(!t){$('#rE').textContent='Escribe la hora correcta';return}

 if(!m){$('#rE').textContent='Escribe el motivo';return}if(!d){$('#rE').textContent='Escribe la descripción del motivo';return}
 const r=await sb.rpc('att_request_change',{p_date:date,p_slot:window._slot,p_time:t,p_reason:m,p_description:d});
 if(r.error){$('#rE').textContent=r.error.message;return}closeModal();dayDetail(date)}
function editForm(){

 if(!Object.keys(sl).length){$('#eE').textContent='No cambiaste ninguna hora';return}if(!why){$('#eE').textContent='Escribe el motivo del cambio';return}
 const r=await sb.rpc('att_edit_day',{p_user:viewUser,p_date:window._day.date,p_slots:sl,p_reason:why});
 if(r.error){$('#eE').textContent=r.error.message;return}closeModal();if(mode==='month')viewMine();else dayDetail(window._day.date)}

function askApprove(id){const x=window._reqs.find(y=>y.id===id);

let schedUser=null,schMonth=new Date().toLocaleDateString('sv',{timeZone:TZ}).slice(0,7),schRows=[],ovr=[];
const WD=[[1,'Lun'],[2,'Mar'],[3,'Mié'],[4,'Jue'],[5,'Vie'],[6,'Sáb'],[7,'Dom']];
const hm5=t=>t?String(t).slice(0,5):'';
const isoDow=d=>((new Date(d+'T12:00:00Z').getUTCDay()+6)%7)+1;
function shiftMonth(n){const [y,m]=schMonth.split('-').map(Number);const d=new Date(Date.UTC(y,m-1+n,1));schMonth=d.toISOString().slice(0,7);viewSched()}
async function viewSched(){
 const people=profiles.filter(p=>p.active!==false);if(!schedUser)schedUser=(people[0]||{}).id;
 $('#v').innerHTML='<div class="empty">Cargando…</div>';
 const first=schMonth+'-01',last=monthLast(schMonth);
 const [d,o]=await Promise.all([sb.rpc('att_daily',{p_user:schedUser,p_from:first,p_to:last}),sb.from('att_day_overrides').select('*').order('work_date',{ascending:false}).limit(60)]);
 schRows=d.data||[];ovr=o.data||[];
 const opts=sel=>people.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)}</option>`).join('');
 const off=(new Date(first+'T12:00:00Z').getUTCDay()+6)%7;
 const cells=[...Array(off).fill('<div class="day blank"></div>'),...schRows.map(r=>{
  const wk=r.day_type==='workday',c=wk?'b':r.day_type==='off'?'x':r.day_type==='holiday'?'b':'';
  const txt=wk?hm5(r.sched_start)+'–'+hm5(r.sched_end):r.day_type==='off'?'Libre':r.day_type==='holiday'?'Feriado':'—';
  const gl=r.day_type==='holiday';
  return`<button class="day ${c}" ${gl?'disabled style="cursor:default"':''} onclick="dayEd('${r.work_date}')"><span class="n">${+r.work_date.slice(8)}</span><span class="tm">${txt}</span>${wk&&r.sched_bo?`<span class="tm">☕ ${hm5(r.sched_bo)}–${hm5(r.sched_bi)}</span>`:''}</button>`})];
 const nm=new Date(first+'T12:00:00Z').toLocaleDateString('es-CO',{month:'long',year:'numeric',timeZone:'UTC'});
 $('#v').innerHTML=`
 <div class="card"><h3>Tolerancias de tardanza</h3><p class="note">Por día: hasta estos minutos la tardanza se marca naranja; más que eso, roja (0 minutos es verde). Por mes: minutos de tardanza acumulada que se toleran en el mes.</p>
 <div class="row"><label>Por día (min) <input id="tD" type="number" min="0" max="240" value="${cfg.late_threshold_min}"></label><label>Por mes (min) <input id="tM" type="number" min="0" max="2000" value="${cfg.monthly_tolerance_min}"></label><button class="btn p" onclick="saveTol()">Guardar tolerancias</button><span class="ok" id="tOk"></span></div></div>
 <div class="card"><h3>Horario del mes por colaborador</h3><p class="note">Toca un día para fijar su Entrada, Salida a refrigerio, Regreso de refrigerio y Salida, o para marcarlo como libre. Puedes editarlo cuando quieras.</p>
 <div class="row" style="margin:8px 0"><select id="sU" onchange="schedUser=this.value;viewSched()">${opts(schedUser)}</select>
 <button class="btn s" onclick="shiftMonth(-1)" aria-label="Mes anterior">‹</button><b style="min-width:140px;text-align:center;text-transform:capitalize">${esc(nm)}</b><button class="btn s" onclick="shiftMonth(1)" aria-label="Mes siguiente">›</button></div>
 <div class="cal">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x=>`<div class="dh">${x}</div>`).join('')}${cells.join('')}</div>
 <div class="lg"><span><i class="b"></i>Con horario</span><span><i class="x"></i>Libre</span><span><i style="background:var(--card)"></i>Sin horario</span></div></div>
 <div class="card"><h3>Feriados y días especiales</h3><p class="note">Un feriado para todos o un día libre de una persona. No exige horario ni cuenta tardanza.</p>
 <div class="row" style="margin:8px 0"><input id="oD" type="date"><select id="oW"><option value="">Todos</option>${opts('')}</select><select id="oK"><option value="holiday">Feriado</option><option value="off">Día libre</option></select><input id="oN" placeholder="Nota (opcional)"><button class="btn p" onclick="addOvr()">Agregar</button></div><div class="err" id="oErr"></div>
 <div class="tw"><table><thead><tr><th>Fecha</th><th>Aplica a</th><th>Tipo</th><th>Nota</th><th></th></tr></thead><tbody>${ovr.filter(x=>x.kind!=='custom').map(x=>`<tr><td>${x.work_date}</td><td>${x.user_id?esc(nameOf(x.user_id)):'Todos'}</td><td>${x.kind==='holiday'?'Feriado':'Día libre'}</td><td class="mut">${esc(x.note||'')}</td><td><button class="btn s r" onclick="delOvr(${x.id})">Quitar</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Sin feriados cargados</td></tr>'}</tbody></table></div></div>`;

function dayEd(date){
 const r=schRows.find(x=>x.work_date===date)||{},wk=r.day_type==='workday',kind=wk?'work':r.day_type==='off'?'off':'clear';
 const v=(x,def)=>wk&&x?hm5(x):(wk?'':def);
 modal(`<h3>${esc(nameOf(schedUser))}</h3><p class="note">${dow(date)} ${esc(date.slice(8))}/${esc(date.slice(5,7))}/${esc(date.slice(0,4))}</p>
 <div class="row" style="margin-bottom:8px">${[['work','Trabaja'],['off','Día libre'],['clear','Sin horario']].map(([k,l])=>`<label class="sw"><input type="radio" name="dk" value="${k}" ${kind===k?'checked':''} onchange="dkToggle()"> ${l}</label>`).join('')}</div>
 <div id="dkT" class="slots" style="${kind==='work'?'':'display:none'}">
  <label class="slot"><div class="l">Entrada</div><input type="time" id="h_s" value="${v(r.sched_start,'10:00')}" style="width:100%"></label>
  <label class="slot"><div class="l">Salida a refrigerio</div><input type="time" id="h_bs" value="${v(r.sched_bo,'13:00')}" style="width:100%"></label>
  <label class="slot"><div class="l">Regreso de refrigerio</div><input type="time" id="h_be" value="${v(r.sched_bi,'14:00')}" style="width:100%"></label>
  <label class="slot"><div class="l">Salida</div><input type="time" id="h_e" value="${v(r.sched_end,'19:00')}" style="width:100%"></label></div>
 <p class="note" style="margin:6px 0 4px">Aplicar lo mismo a todos estos días del mes (opcional):</p>
 <div class="row" style="gap:12px">${WD.map(([n,l])=>`<label class="sw"><input type="checkbox" class="dw" value="${n}"> ${l}</label>`).join('')}</div>
 <div class="err" id="hE"></div><div class="row" style="margin-top:8px"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn p" onclick="saveDay('${date}')">Guardar</button></div>`);
}
function dkToggle(){const k=document.querySelector('input[name=dk]:checked').value;$('#dkT').style.display=k==='work'?'':'none'}
async function saveDay(date){
 const kind=document.querySelector('input[name=dk]:checked').value;let s=null,bs=null,be=null,e=null;
 if(kind==='work'){s=$('#h_s').value;bs=$('#h_bs').value||null;be=$('#h_be').value||null;e=$('#h_e').value;
  if(!s||!e||e<=s){$('#hE').textContent='La salida debe ser mayor que la entrada';return}
  if(!!bs!==!!be){$('#hE').textContent='Completa la salida y el regreso de refrigerio (o déjalos vacíos)';return}
  if(bs&&(be<=bs||bs<s||be>e)){$('#hE').textContent='El refrigerio debe estar dentro del horario';return}}
 const wds=[...document.querySelectorAll('.dw:checked')].map(x=>+x.value);
 const dates=new Set([date]);schRows.forEach(r=>{if(wds.includes(isoDow(r.work_date))&&r.day_type!=='holiday')dates.add(r.work_date)});
 if(dates.size>1&&!confirm('Se aplicará a '+dates.size+' días del mes y reemplaza lo que tengan. ¿Continuar?'))return;
 const r=await sb.rpc('att_set_days',{p_user:schedUser,p_dates:[...dates].sort(),p_kind:kind,p_start:s,p_bs:bs,p_be:be,p_end:e});
 if(r.error){$('#hE').textContent=r.error.message;return}closeModal();viewSched()}
async function saveTol(){const d=parseInt($('#tD').value,10),m=parseInt($('#tM').value,10);
 if(isNaN(d)||isNaN(m)||d<0||m<0){$('#tOk').textContent='Escribe números válidos';return}
 const r=await sb.from('att_settings').update({late_threshold_min:d,monthly_tolerance_min:m}).eq('id',1);
