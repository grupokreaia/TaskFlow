<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F94C1B"><title>Grupo Krea Capital · Asistencia</title>
<link rel="icon" href="../icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f5f4;--card:#fff;--text:#2b2a2a;--mut:#706f6f;--line:#e6e3e1;--acc:#F94C1B;--gr:#1a9b50;--or:#e08a00;--rd:#d6361f;--grb:#e3f5ea;--orb:#fff1d6;--rdb:#fde4df;--sh:0 4px 20px rgba(60,40,30,.08)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161515;--card:#232120;--text:#f1eeec;--mut:#a5a09d;--line:#38342f;--grb:#16331f;--orb:#3a2c0e;--rdb:#3d1d17;--sh:0 4px 24px rgba(0,0,0,.45)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.brandbar{height:4px;background:linear-gradient(90deg,var(--acc),#F5B731);position:fixed;top:0;left:0;right:0;z-index:6}
header{display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto;padding:16px 16px 0}
.back{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);display:grid;place-items:center;flex:none;text-decoration:none;box-shadow:var(--sh);transition:transform .15s,background .15s,color .15s}
.back:hover{background:var(--acc);border-color:var(--acc);color:#fff;transform:translateX(-2px)}.back svg{width:20px;height:20px}
.logo{font-weight:800;display:flex;align-items:center;gap:8px;margin-right:auto;min-width:0}.logo img{height:38px;width:auto;display:block}
.logo b{font-size:15px;line-height:1.1;color:var(--mut)}.logo b span{display:block;color:var(--acc);font-weight:800}
.chip{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border:1px solid var(--line);border-radius:99px;background:var(--card)}
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;flex:none;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}.av.ph{padding:2px}
@media(max-width:560px){.logo b{display:none}.chip>b{display:none}.chip{padding:4px}}
a.lnk,button{font:inherit;cursor:pointer}a.lnk{color:var(--mut);text-decoration:none;font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:8px 14px}.btn.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}.btn.s{padding:5px 10px;font-size:13px}.btn:disabled{opacity:.5}
main{max-width:1100px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 16px;border-radius:999px}.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}select,input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kpi{border:1px solid var(--line);border-radius:14px;padding:12px}.kpi .v{font-size:22px;font-weight:700}.kpi .l{font-size:12px;color:var(--mut)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{font-size:12px;color:var(--mut);font-weight:600}
td.n,th.n{text-align:right}.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600}.g{background:var(--grb);color:var(--gr)}.o{background:var(--orb);color:var(--or)}.r{background:var(--rdb);color:var(--rd)}
.mut{color:var(--mut)}.err{color:var(--rd);min-height:1.2em;font-size:13px}.note{font-size:13px;color:var(--mut)}
.login{max-width:360px;margin:12vh auto}.login input{width:100%;margin:6px 0 10px}
.we td{color:var(--mut)}.empty{padding:24px;text-align:center;color:var(--mut)}
h3{margin:0 0 4px;font-size:16px}.ok{color:var(--gr);font-size:13px;min-height:1.2em}input[type=time],input[type=date]{min-width:110px}input[type=number]{width:90px}
.wk td{padding:5px 9px}.btn.r{color:var(--rd)}.sw{display:flex;align-items:center;gap:6px}.sw input{width:auto}
</style></head><body>
<div id="app"></div>
<script>
const SB_URL='https://xlxlvodttebgjkskkkti.supabase.co',SB_KEY='sb_publishable_cVkWbrGXdP0BxiuGWHBpeg_L0jlT_mt';
const sb=supabase.createClient(SB_URL,SB_KEY);          // misma sesión que TaskFlow (mismo sitio y mismo almacenamiento)
const TZ='America/Bogota',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cfg={late_threshold_min:10,monthly_tolerance_min:30},me=null,profiles=[],areas=[],tab='mine',viewUser=null,month=new Date().toLocaleDateString('sv',{timeZone:TZ}).slice(0,7),emps=[],err='';

// 1h 20min / 30min
const fm=m=>{if(m==null)return'–';const s=m<0?'-':'',a=Math.abs(m),h=Math.floor(a/60),r=a%60;return s+(h?h+'h'+(r?' '+r+'min':''):r+'min')};
const ft=t=>t?new Date(t).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:TZ}):'–';
const pc=x=>x==null?'–':Math.round(x*100)+'%';
const DOW=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const dow=d=>DOW[new Date(d+'T12:00:00Z').getUTCDay()];
const late=r=>{if(r.day_type!=='workday'||!r.entrada)return'<span class="mut">–</span>';const m=r.late_min||0;return`<span class="chip ${m===0?'g':m<=cfg.late_threshold_min?'o':'r'}">${m===0?'0':fm(m)}</span>`};
const isAdmin=()=>me&&me.role==='admin';
const ini=n=>(n||'?').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
const av=u=>u&&u.avatar_url?`<span class="av ph" style="background:${esc(u.color)}"><img src="${esc(u.avatar_url)}" alt="" data-i="${esc(ini(u.name))}" onerror="this.parentNode.classList.remove('ph');this.replaceWith(document.createTextNode(this.dataset.i))"></span>`:`<span class="av" style="background:${u?esc(u.color||'#94a3b8'):'#94a3b8'}">${esc(ini(u&&u.name))}</span>`;

async function init(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){return loginView()}
 const r=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
 if(!r.data||r.data.active===false){await sb.auth.signOut();return loginView('Tu cuenta no tiene acceso')}
 me=r.data;viewUser=me.id;
 const [p,a]=await Promise.all([sb.from('profiles').select('id,name,username,role,area_id,active').order('name'),sb.from('areas').select('*').order('name')]);
 profiles=p.data||[];areas=a.data||[];
 const c=await sb.from('att_settings').select('*').eq('id',1).maybeSingle();if(c.data)cfg=c.data;
 await loadEmps();render();
}
async function loadEmps(){const r=await sb.from('att_employees').select('user_id,pin,active');emps=r.data||[];if(r.error)err='No se pudo leer: '+r.error.message}
const pinOf=id=>(emps.find(e=>e.user_id===id)||{}).pin||'';
const nameOf=id=>(profiles.find(p=>p.id===id)||{}).name||'—';

function loginView(msg){
 $('#app').innerHTML=`<div class="login card"><div style="text-align:center"><img src="../logo.png" alt="" style="height:44px"><h2 style="margin:8px 0 2px">Asistencia</h2><div class="note">Usa tu mismo usuario y contraseña de TaskFlow</div></div>
 <label>Usuario</label><input id="u" autocomplete="username" autocapitalize="none"><label>Contraseña</label><input id="p" type="password" autocomplete="current-password">
 <div class="err" id="e">${esc(msg||'')}</div><button class="btn p" style="width:100%" onclick="login()">Entrar</button></div>`;
 $('#p').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
}
async function login(){
 const u=$('#u').value.trim().toLowerCase(),pw=$('#p').value;if(!u||!pw){$('#e').textContent='Escribe usuario y contraseña';return}
 const {error}=await sb.auth.signInWithPassword({email:u.includes('@')?u:u+'@taskflow.app',password:pw});
 if(error){$('#e').textContent='Usuario o contraseña incorrectos';return}
 init();
}

function render(){
 const tabs=[['mine','Mi asistencia'],...(isAdmin()?[['emps','Empleados'],['sched','Horarios']]:[])];
 $('#app').innerHTML=`<div class="brandbar"></div><header><a class="back" href="../" title="Volver a Control de tareas" aria-label="Volver a Control de tareas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></a>
 <div class="logo"><img src="../logo-mark.png" alt="Krea"><b>Grupo Krea Capital<span>Asistencia</span></b></div>
 <div class="chip">${av(me)}<b>${esc(me.name)}</b></div></header>
 <main><div class="tabs">${tabs.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</div><div id="v"></div></main>`;
 tab==='emps'?viewEmps():tab==='sched'?viewSched():viewMine();
}
const go=t=>{tab=t;render()};

/* ---------- Mi asistencia ---------- */
async function viewMine(){
 const visible=emps.filter(e=>e.active!==false).map(e=>e.user_id);if(!visible.includes(me.id)&&isAdmin()===false)visible.unshift(me.id);
 const opts=[...new Set([me.id,...visible])].map(id=>`<option value="${id}" ${id===viewUser?'selected':''}>${esc(nameOf(id))}${id===me.id?' (yo)':''}${pinOf(id)?'':' · sin ID'}</option>`).join('');
 $('#v').innerHTML=`<div class="card row">${visible.length>1||isAdmin()?`<select id="who" onchange="viewUser=this.value;viewMine()">${opts}</select>`:''}<input id="mo" type="month" value="${month}" onchange="month=this.value;viewMine()"><span class="note" id="pinNote"></span></div><div id="res"><div class="empty">Cargando…</div></div>`;
 const first=month+'-01',last=new Date(Date.UTC(+month.slice(0,4),+month.slice(5,7),0)).toISOString().slice(0,10);
 const [m,d]=await Promise.all([sb.rpc('att_month',{p_user:viewUser,p_month:first}),sb.rpc('att_daily',{p_user:viewUser,p_from:first,p_to:last})]);
 if(m.error||d.error){$('#res').innerHTML=`<div class="card err">No se pudo cargar: ${esc((m.error||d.error).message)}</div>`;return}
 const k=m.data||{},rows=d.data||[];
 const pin=pinOf(viewUser);$('#pinNote').textContent=pin?'ID en el equipo: '+pin:'Esta persona aún no tiene ID del equipo vinculado';
 const kp=(v,l,c)=>`<div class="kpi"><div class="v ${c||''}" ${c?'':''}>${v}</div><div class="l">${l}</div></div>`;
 const hasSched=rows.some(r=>r.day_type==='workday');
 $('#res').innerHTML=`<div class="card"><div class="kpis">
  ${kp(fm(k.worked_min),'Trabajado en el mes')}${kp(hasSched?fm(k.required_to_date_min):'–','Requerido a la fecha')}${kp(hasSched?fm(k.diff_min):'–','Diferencia')}${kp(hasSched?pc(k.compliance):'–','Cumplimiento')}
  ${kp(fm(k.late_total_min),'Tardanza acumulada')}${kp(hasSched?fm(k.tolerance_min):'–','Tolerancia mensual')}${kp(fm(k.late_excess_min),'Tardanza fuera de tolerancia')}${kp(fm(k.extra_total_min),'Horas extras')}
  ${kp(hasSched?pc(k.punctuality):'–','Puntualidad')}${kp(`<span class="chip g">${k.days_green||0}</span> <span class="chip o">${k.days_orange||0}</span> <span class="chip r">${k.days_red||0}</span>`,'Días verde · naranja · rojo')}</div>
  ${hasSched?'':'<p class="note">Todavía no hay un horario asignado a esta persona: se muestran los marcajes y las horas trabajadas. Los cálculos de tardanza y cumplimiento aparecerán cuando se asigne el horario.</p>'}</div>
 <div class="card tw"><table><thead><tr><th>Fecha</th><th>Horario</th><th>Entrada</th><th>Sal. refrigerio</th><th>Ing. refrigerio</th><th>Salida</th><th class="n">Trabajadas</th><th class="n">Requeridas</th><th>Tardanza</th><th class="n">Extras</th><th>Estado</th></tr></thead><tbody>
 ${rows.filter(r=>r.day_type!=='none'||r.punches>0).map(r=>`<tr class="${r.day_type==='off'||r.day_type==='holiday'?'we':''}"><td>${esc(r.work_date.slice(8))} ${dow(r.work_date)}</td><td>${r.sched_start?r.sched_start.slice(0,5)+'–'+r.sched_end.slice(0,5):'–'}</td><td>${ft(r.entrada)}</td><td>${ft(r.salida_refri)}</td><td>${ft(r.ingreso_refri)}</td><td>${ft(r.salida)}</td><td class="n">${r.punches?fm(r.worked_min):'–'}</td><td class="n">${r.day_type==='workday'?fm(r.required_min):'–'}</td><td>${late(r)}</td><td class="n">${r.day_type==='workday'&&r.extra_min?fm(r.extra_min):'–'}</td><td>${esc(r.status||'')}${r.flag?` <span class="note">· ${esc(r.flag)}</span>`:''}</td></tr>`).join('')||'<tr><td colspan="11" class="empty">Sin marcajes en este mes</td></tr>'}
 </tbody></table></div>`;
}

/* ---------- Empleados (solo administrador) ---------- */
async function viewEmps(){
 const un=await sb.rpc('att_unlinked_pins');const pend=un.data||[];
 const people=profiles.filter(p=>p.active!==false);
 const opt=`<option value="">Elegir persona…</option>${people.filter(p=>!pinOf(p.id)).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}`;
 $('#v').innerHTML=`${pend.length?`<div class="card"><b>IDs del equipo sin persona</b><p class="note">Estos IDs ya enviaron marcajes. Elige a quién pertenecen y sus marcajes se enlazan al instante.</p><div class="tw"><table><thead><tr><th>ID del equipo</th><th class="n">Marcajes</th><th>Último</th><th>Persona</th><th></th></tr></thead><tbody>
 ${pend.map((x,i)=>`<tr><td><b>${esc(x.pin)}</b></td><td class="n">${x.punches}</td><td>${new Date(x.last_at).toLocaleString('es-CO',{timeZone:TZ,dateStyle:'short',timeStyle:'short'})}</td><td><select id="pp${i}">${opt}</select></td><td><button class="btn s p" onclick="linkPending(${i},'${esc(x.pin)}')">Vincular</button></td></tr>`).join('')}</tbody></table></div></div>`:''}
 <div class="card"><b>Colaboradores</b><p class="note">El ID es el número con el que la persona está registrada en el equipo (SenseFace). Al guardarlo, sus marcajes anteriores se enlazan solos.</p><div class="err" id="ee">${esc(err)}</div><div class="tw"><table><thead><tr><th>Nombre</th><th>Usuario</th><th>Área</th><th>ID del equipo</th><th></th></tr></thead><tbody>
 ${people.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td class="mut">@${esc(p.username)}</td><td class="mut">${esc((areas.find(a=>a.id===p.area_id)||{}).name||'–')}</td><td><input id="pin_${p.id}" value="${esc(pinOf(p.id))}" placeholder="Sin ID" style="width:140px" inputmode="numeric"></td><td><button class="btn s p" onclick="savePin('${p.id}')">Guardar</button> ${pinOf(p.id)?`<button class="btn s" onclick="unlink('${p.id}')">Quitar</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`;
}
async function savePin(id){const v=$('#pin_'+id).value.trim();err='';if(!v){err='Escribe el ID del equipo';return viewEmps()}
 const r=await sb.rpc('att_link_employee',{p_user:id,p_pin:v});if(r.error)err=r.error.message;await loadEmps();viewEmps()}
async function linkPending(i,pin){const id=$('#pp'+i).value;err='';if(!id){err='Elige una persona para el ID '+pin;return viewEmps()}
 const r=await sb.rpc('att_link_employee',{p_user:id,p_pin:pin});if(r.error)err=r.error.message;await loadEmps();viewEmps()}
async function unlink(id){if(!confirm('¿Quitar el ID del equipo de '+nameOf(id)+'? Sus marcajes se conservan.'))return;
 err='';const r=await sb.rpc('att_unlink_employee',{p_user:id});if(r.error)err=r.error.message;await loadEmps();viewEmps()}

/* ---------- Horarios y tolerancias (solo administrador) ---------- */
let schedUser=null,schedFrom=new Date().toLocaleDateString('sv',{timeZone:TZ}),weekState={},schedMsg='',schedNote='',ovr=[];
const WD=[[1,'Lunes'],[2,'Martes'],[3,'Miércoles'],[4,'Jueves'],[5,'Viernes'],[6,'Sábado'],[7,'Domingo']];
const hm5=t=>t?String(t).slice(0,5):'';
async function loadWeek(uid,date){
 weekState={};schedNote='';
 const r=await sb.rpc('att_user_week',{p_user:uid,p_date:date});
 const rows=r.data||[];
 if(rows.length&&rows[0].kind==='rotating')schedNote='Esta persona tiene un turno rotativo. Si guardas un horario semanal, reemplaza el turno rotativo desde la fecha elegida.';
 else if(rows.length)schedNote='Horario vigente desde el '+rows[0].valid_from+'.';
 else schedNote='Esta persona todavía no tiene horario asignado.';
 rows.filter(x=>x.start_time).forEach(x=>weekState[x.weekday]={on:true,s:hm5(x.start_time),e:hm5(x.end_time)});
}
async function viewSched(){
 const people=profiles.filter(p=>p.active!==false);if(!schedUser)schedUser=(people[0]||{}).id;
 $('#v').innerHTML='<div class="empty">Cargando…</div>';
 await loadWeek(schedUser,schedFrom);
 const o=await sb.from('att_day_overrides').select('*').order('work_date',{ascending:false}).limit(60);ovr=o.data||[];
 const opts=sel=>people.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)}</option>`).join('');
 $('#v').innerHTML=`
 <div class="card"><h3>Tolerancias de tardanza</h3><p class="note">Diaria: hasta estos minutos la tardanza se marca naranja; más que eso, roja (0 minutos es verde). Mensual: minutos de tardanza acumulada que se toleran en el mes.</p>
 <div class="row"><label>Por día (min) <input id="tD" type="number" min="0" max="240" value="${cfg.late_threshold_min}"></label><label>Por mes (min) <input id="tM" type="number" min="0" max="2000" value="${cfg.monthly_tolerance_min}"></label><button class="btn p" onclick="saveTol()">Guardar tolerancias</button><span class="ok" id="tOk"></span></div></div>
 <div class="card"><h3>Horario semanal por colaborador</h3><div class="row" style="margin:8px 0"><select id="sU" onchange="schedUser=this.value;viewSched()">${opts(schedUser)}</select>
 <label>Rige desde <input id="sF" type="date" value="${schedFrom}" onchange="schedFrom=this.value;viewSched()"></label>
 <select id="sC" onchange="copyWeek(this.value)"><option value="">Copiar horario de…</option>${people.filter(p=>p.id!==schedUser).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
 <p class="note"><span id="sNote">${esc(schedNote)}</span> Los días anteriores a la fecha «Rige desde» conservan su horario anterior. Los días sin marcar son libres.</p>
 <div class="tw"><table class="wk"><thead><tr><th>Día</th><th>Trabaja</th><th>Entrada</th><th>Salida</th></tr></thead><tbody>
 ${WD.map(([n,l])=>{const w=weekState[n]||{on:false,s:'10:00',e:'19:00'};return`<tr><td>${l}</td><td><input type="checkbox" id="on${n}" ${w.on?'checked':''}></td><td><input type="time" id="s${n}" value="${w.s}"></td><td><input type="time" id="e${n}" value="${w.e}"></td></tr>`}).join('')}</tbody></table></div>
 <div class="row" style="margin-top:10px"><button class="btn p" onclick="saveWeek()">Guardar horario</button><span class="err" id="sErr">${esc(schedMsg)}</span></div></div>
 <div class="card"><h3>Feriados y días especiales</h3><p class="note">Un feriado o día libre no exige horario ni cuenta tardanza. «Horario especial» cambia la hora de ese día.</p>
 <div class="row" style="margin:8px 0"><input id="oD" type="date"><select id="oW"><option value="">Todos</option>${opts('')}</select><select id="oK" onchange="document.getElementById('oT').style.display=this.value==='custom'?'flex':'none'"><option value="holiday">Feriado</option><option value="off">Día libre</option><option value="custom">Horario especial</option></select>
 <span id="oT" class="row" style="display:none"><input id="oS" type="time" value="10:00"><input id="oE" type="time" value="14:00"></span><input id="oN" placeholder="Nota (opcional)"><button class="btn p" onclick="addOvr()">Agregar</button></div><div class="err" id="oErr"></div>
 <div class="tw"><table><thead><tr><th>Fecha</th><th>Aplica a</th><th>Tipo</th><th>Nota</th><th></th></tr></thead><tbody>${ovr.map(x=>`<tr><td>${x.work_date}</td><td>${x.user_id?esc(nameOf(x.user_id)):'Todos'}</td><td>${x.kind==='holiday'?'Feriado':x.kind==='off'?'Día libre':'Horario '+hm5(x.start_time)+'–'+hm5(x.end_time)}</td><td class="mut">${esc(x.note||'')}</td><td><button class="btn s r" onclick="delOvr(${x.id})">Quitar</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Sin feriados cargados</td></tr>'}</tbody></table></div></div>`;
}
async function saveTol(){const d=parseInt($('#tD').value,10),m=parseInt($('#tM').value,10);
 if(isNaN(d)||isNaN(m)||d<0||m<0){$('#tOk').textContent='Escribe números válidos';return}
 const r=await sb.from('att_settings').update({late_threshold_min:d,monthly_tolerance_min:m}).eq('id',1);
 if(r.error){$('#tOk').textContent='No se pudo guardar: '+r.error.message;return}
 cfg.late_threshold_min=d;cfg.monthly_tolerance_min=m;$('#tOk').textContent='✅ Guardado'}
async function copyWeek(uid){if(!uid)return;await loadWeek(uid,schedFrom);
 WD.forEach(([n])=>{const w=weekState[n]||{on:false,s:'10:00',e:'19:00'};$('#on'+n).checked=!!w.on;$('#s'+n).value=w.s;$('#e'+n).value=w.e});
 $('#sNote').textContent='Copiado de '+nameOf(uid)+'. Revisa y pulsa Guardar horario.';$('#sC').value=''}
async function saveWeek(){const days=[];schedMsg='';
 for(const [n,l] of WD){if($('#on'+n).checked){const s=$('#s'+n).value,e=$('#e'+n).value;if(!s||!e||e<=s){$('#sErr').textContent=l+': la salida debe ser mayor que la entrada';return}days.push({weekday:n,start:s,end:e})}}
 const from=$('#sF').value;if(!from){$('#sErr').textContent='Elige desde qué fecha rige';return}
 const r=await sb.rpc('att_set_user_week',{p_user:schedUser,p_from:from,p_days:days});
 if(r.error){$('#sErr').textContent=r.error.message;return}
 schedMsg='';await viewSched();$('#sErr').textContent='';const ok=document.createElement('span');ok.className='ok';ok.textContent='✅ Horario guardado';$('#sErr').after(ok)}
async function addOvr(){const d=$('#oD').value,k=$('#oK').value,w=$('#oW').value||null;if(!d){$('#oErr').textContent='Elige la fecha';return}
 const row={work_date:d,kind:k,user_id:w,note:$('#oN').value.trim()||null};
 if(k==='custom'){row.start_time=$('#oS').value;row.end_time=$('#oE').value;if(!row.start_time||!row.end_time||row.end_time<=row.start_time){$('#oErr').textContent='Revisa las horas';return}}
 const r=await sb.from('att_day_overrides').insert(row);if(r.error){$('#oErr').textContent=r.error.code==='23505'?'Ya hay algo cargado para esa fecha y persona':r.error.message;return}viewSched()}
async function delOvr(id){if(!confirm('¿Quitar este día especial?'))return;await sb.from('att_day_overrides').delete().eq('id',id);viewSched()}

init();
</script></body></html>
