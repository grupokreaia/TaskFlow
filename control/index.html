function saveProyecto(){
  clearErrs();let ok=true;const id=$('#mf').dataset.id;
  const nombre=gv('p-nombre');
  if(!nombre){setErr('p-nombre','Escribe el nombre del proyecto.');ok=false}
  else if(S.proyectos.some(p=>p.id!==id&&p.nombre.trim().toLowerCase()===nombre.toLowerCase())){setErr('p-nombre','Ya existe un proyecto con ese nombre.');ok=false}
  const tipos=[...document.querySelectorAll('#p-tipos input:checked')].map(i=>i.value);
  if(!tipos.length){setErr('p-tipos','Marca al menos un tipo.');ok=false}
  if(tipos.includes('Otros')&&!gv('p-tipoOtro')){setErr('p-tipoOtro','Detalla el tipo de proyecto.');ok=false}
  let fecha=gv('p-fechaAdq'),anio=num(gv('p-anioAdq'));
  if(fecha)anio=Number(fecha.slice(0,4));
  if(!anio){setErr('p-anioAdq','Indica la fecha o al menos el año de adquisición.');ok=false}
  const imp=num(gv('p-importe'));
  if(imp==null||imp<0){setErr('p-importe','Escribe un importe válido (0 o más).');ok=false}
  const mod=gv('p-modalidad');
  if(mod==='otro'&&!gv('p-modalidadDetalle')){setErr('p-modalidadDetalle','Especifica la modalidad.');ok=false}
  const lot=tipos.some(t=>t==='Lotización'||t==='Habilitación urbana');
  const tot=num(gv('p-lotesTotal'));
  if(lot&&(tot==null||tot<0||!Number.isInteger(tot))){setErr('p-lotesTotal','Escribe el total de lotes (número entero).');ok=false}
  if(!ok)return;
  const prev=id?S.C.projById[id]:{ventasAnio:{},sinDesglose:0,orden:S.proyectos.length+1};
  const data={...prev,nombre,tipos,tipoOtro:tipos.includes('Otros')?gv('p-tipoOtro'):'',fechaAdq:fecha,anioAdq:anio,importe:imp,moneda:gv('p-moneda'),monedaConfirmada:$('#p-mc').checked,
    modalidad:mod,modalidadDetalle:mod==='otro'?gv('p-modalidadDetalle'):'',departamento:gv('p-departamento'),provincia:gv('p-provincia'),distrito:gv('p-distrito'),referencia:gv('p-referencia'),
    lotesTotal:lot?tot:(tot==null?0:tot),anioInicio:num(gv('p-anioInicio'))||anio,pendienteRegistro:$('#p-reg').checked,obs:gv('p-obs'),obsLotes:gv('p-obsLotes')};
  delete data.id;
  persist(()=>Store.set(COLS.proyectos,id||newId('p_'),data),id?'Proyecto actualizado':'Proyecto agregado');
}

function openEscritura(id){
  const e=id?S.C.esc.find(x=>x.id===id):{fecha:'',mz:'',lotes:'',importe:'',obs:'',proyectoId:S.fEsc||''};
  const popts=`<option value="">Elige un proyecto</option>`+S.proyectos.map(p=>`<option value="${p.id}" ${e.proyectoId===p.id?'selected':''}>${esc(p.nombre)}</option>`).join('');
  const body=
   fld('e-proyecto','Proyecto',`<select id="e-proyecto">${popts}</select>`,'',true)+
   fld('e-fecha','Fecha de la escritura',`<input id="e-fecha" type="date" value="${esc(e.fecha||'')}">`)+
   fld('e-mz','Manzana (Mz)',`<input id="e-mz" value="${esc(e.mz||'')}" autocomplete="off" style="text-transform:uppercase">`)+
   fld('e-lotes','Nro. de lote',`<input id="e-lotes" value="${esc(e.lotes||'')}" autocomplete="off">`,'Un lote o varios: 7 · 11 y 12 · 4,5,6,7 · 4-7',true)+
   fld('e-importe','Importe de la venta (S/)',`<input id="e-importe" type="number" min="0" step="0.01" inputmode="decimal" value="${e.importe==null?'':esc(e.importe)}">`)+
   fld('e-obs','Observaciones',`<input id="e-obs" value="${esc(e.obs||'')}">`)+
   `<div class="preview" id="e-prev" aria-live="polite"></div>`;
  openModal(id?'Editar escritura':'Nueva escritura',body,`<button type="button" class="btn" data-act="close">Cancelar</button><button type="submit" class="btn primary">Guardar</button>`,delButtons('e',id));
  $('#mf').dataset.kind='e';$('#mf').dataset.id=id||'';
  updatePreview();
}
function escChecks(){
  const id=$('#mf').dataset.id,pid=gv('e-proyecto'),mz=gv('e-mz').toUpperCase(),lotes=parseLotes(gv('e-lotes'));
  const dup=[];
  if(pid&&mz)lotes.forEach(l=>{const o=S.C.esc.find(e=>e.id!==id&&e.proyectoId===pid&&String(e.mz||'').trim().toUpperCase()===mz&&e._l.includes(l));if(o)dup.push({l,o});
    if(lotes.filter(x=>x===l).length>1)dup.push({l,o:null})});
  return {pid,mz,lotes,dup};
}
function updatePreview(){
  const box=$('#e-prev');if(!box)return;
  const {lotes,dup}=escChecks();const imp=num(gv('e-importe'));const f=gv('e-fecha');
  let h='';
  if(lotes.length){h+=`<div><b>${lotes.length} lote${lotes.length>1?'s':''}</b></div><div class="chips">${lotes.map(l=>`<span class="chip ${dup.some(d=>d.l===l)?'dup':''}">${esc(l)}</span>`).join('')}</div>`;
    if(imp>0)h+=`<div>Precio por lote: <b class="mono">${money(imp/lotes.length)}</b></div>`}
  else h='<span class="hint">Escribe los lotes para ver el conteo y el precio por lote.</span>';
  if(dup.length)h+=`<div style="color:var(--bad)">Ya registrado: ${dup.map(d=>esc(d.l)+(d.o?' (escritura del '+fdate(d.o.fecha)+')':' (repetido)')).join(', ')}.</div>`;
  if(f&&(f<S.cfg.periodoDesde||f>S.cfg.periodoHasta))h+=`<div style="color:var(--hi)">La fecha está fuera del periodo ${fdate(S.cfg.periodoDesde)} a ${fdate(S.cfg.periodoHasta)}. Se puede guardar y quedará marcada.</div>`;
  box.innerHTML=h;
}
function saveEscritura(){
  clearErrs();let ok=true;const id=$('#mf').dataset.id;
  const {pid,mz,lotes,dup}=escChecks();
  if(!pid){setErr('e-proyecto','Elige el proyecto.');ok=false}
  if(!gv('e-fecha')){setErr('e-fecha','Indica la fecha de la escritura.');ok=false}
  if(!mz){setErr('e-mz','Indica la manzana.');ok=false}
  if(!lotes.length){setErr('e-lotes','Indica al menos un lote.');ok=false}
  else if(dup.length){setErr('e-lotes','Ese lote ya está registrado en esa manzana.');ok=false}
  const imp=num(gv('e-importe'));
  if(!(imp>0)){setErr('e-importe','Escribe un importe mayor que 0.');ok=false}
  if(!ok)return;
  const data={proyectoId:pid,fecha:gv('e-fecha'),mz,lotes:gv('e-lotes'),importe:imp,obs:gv('e-obs')};
  persist(()=>Store.set(COLS.escrituras,id||newId('e_'),data),id?'Escritura actualizada':'Escritura agregada');
}

function openServicio(id){
  const s=id?S.servicios.find(x=>x.id===id):{servicio:'',obs:''};
  openModal(id?'Editar servicio':'Nuevo servicio',
    fld('s-servicio','Servicio prestado',`<input id="s-servicio" value="${esc(s.servicio||'')}">`,'',true)+fld('s-obs','Observaciones',`<textarea id="s-obs">${esc(s.obs||'')}</textarea>`,'',true),
    `<button type="button" class="btn" data-act="close">Cancelar</button><button type="submit" class="btn primary">Guardar</button>`,delButtons('s',id));
  $('#mf').dataset.kind='s';$('#mf').dataset.id=id||'';
}
function saveServicio(){
  clearErrs();const id=$('#mf').dataset.id;
  if(!gv('s-servicio')){setErr('s-servicio','Describe el servicio prestado.');return}
  persist(()=>Store.set(COLS.servicios,id||newId('s_'),{servicio:gv('s-servicio'),obs:gv('s-obs'),orden:id?(S.servicios.find(x=>x.id===id)||{}).orden:S.servicios.length+1}),id?'Servicio actualizado':'Servicio agregado');
}

function openSettings(){
  const c=S.cfg;
  openModal('Ajustes del formato',
    fld('c-desde','Periodo de escrituras: desde',`<input id="c-desde" type="date" value="${esc(c.periodoDesde)}">`)+
    fld('c-hasta','Periodo de escrituras: hasta',`<input id="c-hasta" type="date" value="${esc(c.periodoHasta)}">`)+
    fld('c-amin','Primer año del cuadro por año',`<input id="c-amin" type="number" min="1980" max="2100" value="${c.anioMin}">`)+
    fld('c-amax','Último año del cuadro por año',`<input id="c-amax" type="number" min="1980" max="2100" value="${c.anioMax}">`)+
    `<div class="fld full"><div class="hint">Cuando la entidad pida otro periodo, cámbialo aquí y todas las alertas y totales se ajustan.</div></div>`,
    `<button type="button" class="btn" data-act="close">Cancelar</button><button type="submit" class="btn primary">Guardar</button>`);
  $('#mf').dataset.kind='c';$('#mf').dataset.id='';
}
function saveSettings(){
  clearErrs();let ok=true;
  const d=gv('c-desde'),h=gv('c-hasta'),a=num(gv('c-amin')),b=num(gv('c-amax'));
  if(!d){setErr('c-desde','Indica la fecha inicial.');ok=false}
  if(!h){setErr('c-hasta','Indica la fecha final.');ok=false}
  if(d&&h&&d>h){setErr('c-hasta','La fecha final debe ser posterior a la inicial.');ok=false}
  if(!a||!b||a>b||b-a>15){setErr('c-amax','Indica un rango de años válido (máximo 16 años).');ok=false}
  if(!ok)return;
  persist(()=>Store.update(COLS.config,'proyectos',{periodoDesde:d,periodoHasta:h,anioMin:a,anioMax:b}),'Ajustes guardados');
}

async function persist(fn,msg){
  const btn=$('#mf button[type=submit]');if(btn){btn.disabled=true;btn.textContent='Guardando…'}
  try{await fn();closeModal();toast(msg)}
  catch(e){if(btn){btn.disabled=false;btn.textContent='Guardar'}
    const code=e&&e.code;toast(code==='42501'||code==='invalid_argument'?'No tienes permiso para guardar cambios en este archivo.':code==='quota_exceeded'?'Se llenó el espacio de datos. Elimina registros que ya no uses.':'No se pudo guardar. Intenta de nuevo.')}
}
let toastT=null;
function toast(msg){const t=$('#toast');t.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>t.innerHTML='',3200)}

/* ---------- exportar a Excel (mismo orden de cuadros que el formato) ---------- */
function serial(iso){if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||''))return '';const [y,m,d]=iso.split('-').map(Number);return (Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/86400000}
async function exportXlsx(){
  const X=window.XLSX;if(!X){toast('No se pudo cargar el generador de Excel.');return}
  const dl=DL;
  const C=S.C,yrs=years(),py=periodYear();
  const aoa=[],fm=[];let r=0;
  const row=(cells,start=1)=>{aoa[r]=[];cells.forEach((v,i)=>{aoa[r][start+i]=v});return r++};
  const fmt=(rr,cc,z)=>fm.push([rr,cc,z]);
  r=2;row(['LISTA DE PROYECTOS']);
  row(['Cuadro con: nombre del proyecto, tipo, fecha de adquisición, importe de la compra, modalidad de compra y observaciones.']);r++;
  row(['ITEM','NOMBRE DEL PROYECTO','TIPO DE PROYECTO','FECHA DE ADQUISICIÓN','IMPORTE DE LA COMPRA','MONEDA','MODALIDAD DE COMPRA','OBSERVACIONES']);
  S.proyectos.slice().sort((a,b)=>(num(a.orden)||99)-(num(b.orden)||99)||cmpTxt(a.nombre,b.nombre)).forEach((p,i)=>{
    const rr=row([i+1,p.nombre,tipoTxt(p),p.fechaAdq?serial(p.fechaAdq):(p.anioAdq||''),num(p.importe)||0,p.moneda==='USD'?'US$':'S/',p.modalidad==='otro'?(p.modalidadDetalle||MODALIDADES.otro):MODALIDADES[p.modalidad],p.obs||'']);
    if(p.fechaAdq)fmt(rr,4,'dd/mm/yyyy');fmt(rr,5,'#,##0.00');
  });
  r+=2;row(['EN EL CASO DE PROYECTOS DE LOTIZACIÓN Y/O HABILITACIÓN']);r++;
  row(['NOMBRE DEL PROYECTO','UBICACIÓN DEL PROYECTO','NRO. LOTES TOTAL','AÑO DE INICIO',...yrs.map(yearLabel),'SIN AÑO ASIGNADO','TOTAL VENDIDOS CON ESCRITURA','TOTAL LOTES PENDIENTE DE ESCRITURA','OBSERVACIÓN']);
  C.lotProjs.forEach(p=>{const m=C.M[p.id];
    row([p.nombre,ubic(p),m.total,num(p.anioInicio)||num(p.anioAdq)||'',...yrs.map(y=>{const v=num(p.ventasAnio&&p.ventasAnio[y]);return v==null?'':v}),m.sin||0,m.vend,m.pend,[p.obsLotes,p.pendienteRegistro?'Escrituras sin inscribir en Registros Públicos':''].filter(Boolean).join('. ')]);
  });
  row(['TOTAL','',C.T.total,'',...yrs.map(y=>C.lotProjs.reduce((a,p)=>a+(num(p.ventasAnio&&p.ventasAnio[y])||0),0)),'',C.T.vend,C.T.pend,'']);
  r+=2;row([`PROYECTOS VENDIDOS CON ESCRITURA PÚBLICA, ${fdate(S.cfg.periodoDesde)} AL ${fdate(S.cfg.periodoHasta)}`]);
  if(!C.esc.length)row(['No se realizaron escrituras durante el periodo solicitado.']);
  row(['N.°','Nombre del Proyecto','Fecha de la Escritura','MZ','Nro. de Lote','Importe de la Venta','Observaciones']);
  C.esc.forEach((e,i)=>{const rr=row([i+1,C.pName(e.proyectoId),serial(e.fecha),e.mz,e.lotes,e._imp,e.obs||'']);fmt(rr,3,'dd/mm/yyyy');fmt(rr,6,'"S/ "#,##0.00')});
  if(C.esc.length){const rr=row(['','TOTAL','','',C.T.escN+' lotes',C.T.escImp,'']);fmt(rr,6,'"S/ "#,##0.00')}
  r+=2;row(['EN CASO DE PRESTACIÓN DE SERVICIOS',S.cfg.serviciosAplica?'':'NO APLICA']);
  if(S.cfg.serviciosAplica){row(['ITEM','ESPECIFICAR EL SERVICIO PRESTADO','OBSERVACIONES']);S.servicios.forEach((s,i)=>row([i+1,s.servicio,s.obs||'']))}
  const ws=X.utils.aoa_to_sheet(aoa);
  fm.forEach(([rr,cc,z])=>{const c=ws[X.utils.encode_cell({r:rr,c:cc})];if(c)c.z=z});
  ws['!cols']=[{wch:2},{wch:28},{wch:34},{wch:22},{wch:20},{wch:20},{wch:30},{wch:26},{wch:14},{wch:16},{wch:16},{wch:16},{wch:22},{wch:22}];
  const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,'TABLA');
  const q=[['Severidad','Hallazgo','Detalle']];C.alerts.forEach(a=>q.push([SEV[a.sev].n,a.t,a.d||'']));
  const ws2=X.utils.aoa_to_sheet(q);ws2['!cols']=[{wch:12},{wch:70},{wch:90}];X.utils.book_append_sheet(wb,ws2,'Control de calidad');
  const out=X.write(wb,{bookType:'xlsx',type:'array'});
  const d=new Date(),stamp=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  try{await dl.save({filename:'Informacion_Proyectos_'+stamp+'.xlsx',data:out});toast('Archivo listo')}
  catch(e){if(!e||e.code!=='declined')toast('No se pudo guardar el archivo.')}
}

/* ---------- eventos ---------- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='mod'){setRoute(id);return}
  if(a==='ktab'||a.indexOf('k-')===0){kClick(a,b);return}
  if(a==='atab'||a.indexOf('a-')===0){aClick(a,b);return}
  if(a==='btab'||a.indexOf('b-')===0){bClick(a,b);return}
  if(a==='tab'){setRoute('proyectos',id);return}
  if(a==='new-p'){openProyecto();return}
  if(a==='edit-p'){openProyecto(id);return}
  if(a==='new-e'){openEscritura();return}
  if(a==='edit-e'){openEscritura(id);return}
  if(a==='new-s'){openServicio();return}
  if(a==='edit-s'){openServicio(id);return}
  if(a==='settings'){openSettings();return}
  if(a==='export'){exportXlsx();return}
  if(a==='close'){closeModal();return}
  if(a==='go'){const al=S.C.alerts[Number(b.dataset.i)];if(!al)return;
    if(al.go.edit){setRoute('proyectos',al.go.edit.k==='p'?'proyectos':'escrituras');al.go.edit.k==='p'?openProyecto(al.go.edit.id):openEscritura(al.go.edit.id)}
    else setRoute('proyectos',al.go.tab);return}
  if(a==='del-ask'){b.outerHTML=`<span class="hint" style="align-self:center">¿Eliminar de forma definitiva?</span> <button type="button" class="btn danger" data-act="del-yes" data-k="${b.dataset.k}" data-id="${id}">Sí, eliminar</button>`;return}
  if(a==='del-yes'){const k=b.dataset.k,coll=collFor(k);
    persist(async()=>{await Store.del(coll,id);if(k==='ac')for(const x of S.a.pag.filter(x=>x.contrato===id))await Store.del(ACOLS.pag,x.id)},'Eliminado');return}
});
document.addEventListener('submit',ev=>{
  if(ev.target.id!=='mf')return;ev.preventDefault();
  const k=ev.target.dataset.kind;
  if(k==='p')saveProyecto();else if(k==='e')saveEscritura();else if(k==='s')saveServicio();else if(k==='c')saveSettings();else if(k==='kp')saveProdK();else if(k==='km')saveMovK();else if(k==='kc')saveSettingsK();else if(k==='ac')saveContratoA();else if(k==='ag')saveSettingsAq();else if(k==='bm')saveMovB();else if(k==='bg')saveSettingsB();
});
document.addEventListener('input',ev=>{
  const f=ev.target.closest&&ev.target.closest('#mf');
  if(f&&f.dataset.kind==='e')updatePreview();
  if(f&&f.dataset.kind==='km')kInput(ev);
  if(f&&f.dataset.kind==='ac')aInput(ev);
  if(f&&f.dataset.kind==='bm')bInput(ev);
  if(ev.target.dataset&&ev.target.dataset.actIn==='bfq')bChangeIn(ev.target,'bfq');
  if(ev.target.dataset&&ev.target.dataset.actIn==='afq')aChangeIn(ev.target,'afq');
  if(ev.target.dataset&&ev.target.dataset.actIn==='kfq')kChangeIn(ev.target,'kfq');
});
document.addEventListener('change',ev=>{
  const t=ev.target,k=t.dataset&&t.dataset.actIn;
  if(t.closest&&t.closest('#mf')&&$('#mf').dataset.kind==='km'){kChange(ev);return}
  if(t.closest&&t.closest('#mf')&&$('#mf').dataset.kind==='ac'){aChange(ev);return}
  if(t.closest&&t.closest('#mf')&&$('#mf').dataset.kind==='bm'){bChange(ev);return}
  if(k==='bfmes'||k==='bfdir'||k==='bfsin'||k==='bcfg'){bChangeIn(t,k);return}
  if(k==='kfprod'||k==='kftipo'||k==='kmin'){kChangeIn(t,k);return}
  if(k==='afvig'||k==='afcon'||k==='apg'){aChangeIn(t,k);return}
  if(k==='fesc'){S.fEsc=t.value;render();return}
  if(k==='svcon'){Store.update(COLS.config,'proyectos',{serviciosAplica:t.checked}).catch(()=>toast('No se pudo guardar.'));return}
  if(k==='lot'){
    const p=S.C.projById[t.dataset.p];if(!p)return;
    const f=t.dataset.f;let v=t.value===''?null:Number(t.value);
    if(v!=null&&(!Number.isFinite(v)||v<0)){toast('Escribe un número de 0 en adelante.');render();return}
    if(v!=null)v=Math.round(v);
    let cur;
    if(f==='lotesTotal'){cur=num(p.lotesTotal);if(v==null)v=0;if(cur===v)return;Store.update(COLS.proyectos,p.id,{lotesTotal:v}).catch(()=>toast('No se pudo guardar.'))}
    else if(f==='sinDesglose'){cur=num(p.sinDesglose)||0;if(v==null)v=0;if(cur===v)return;Store.update(COLS.proyectos,p.id,{sinDesglose:v}).catch(()=>toast('No se pudo guardar.'))}
    else if(f[0]==='y'){const y=f.slice(1);cur=num(p.ventasAnio&&p.ventasAnio[y]);if(cur===v)return;Store.update(COLS.proyectos,p.id,{ventasAnio:{[y]:v}}).catch(()=>toast('No se pudo guardar.'))}
  }
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&$('#ov'))closeModal()});
window.addEventListener('hashchange',()=>{readHash();render()});

/* ---------- arranque ---------- */
function mark(k){S.ready[k]=true;render()}
(async function start(){
  readHash();
  render();
  if(!(await checkAccess()))return;
  await Store.init();
  S.mode=Store.mode;
  S.canExport=true;
  const onErr=()=>{S.timeout=true;render()};
  Store.watch(COLS.proyectos,l=>{S.proyectos=l;mark('proyectos')},onErr);
  Store.watch(COLS.escrituras,l=>{S.escrituras=l;mark('escrituras')},onErr);
  Store.watch(COLS.servicios,l=>{S.servicios=l;mark('servicios')},onErr);
  Store.watch(COLS.config,l=>{const d=l.find(x=>x.id==='proyectos');S.cfg={...DEF_CFG,...(d||{})};mark('config')},onErr);
  Store.watch(KCOLS.cat,l=>{S.k.cat=l;S.k.ready.cat=true;render()},onErr);
  Store.watch(KCOLS.mov,l=>{S.k.mov=l;S.k.ready.mov=true;render()},onErr);
  Store.watch(KCOLS.cfg,l=>{const d=l.find(x=>x.id==='kardex');S.k.cfg={...KDEF,...(d||{})};S.k.ready.cfg=true;render()},onErr);
  Store.watch(ACOLS.con,l=>{S.a.con=l;S.a.ready.con=true;render()},onErr);
  Store.watch(ACOLS.pag,l=>{S.a.pag=l;S.a.ready.pag=true;render()},onErr);
  Store.watch(ACOLS.cfg,l=>{const d=l.find(x=>x.id==='alquileres');S.a.cfg={...ADEF,...(d||{})};S.a.ready.cfg=true;render()},onErr);
  Store.watch(BCOLS.mov,l=>{S.b.mov=l;S.b.ready.mov=true;render()},onErr);
  Store.watch(BCOLS.cfg,l=>{const d=l.find(x=>x.id==='banco');S.b.cfg={...BDEF,...(d||{})};S.b.ready.cfg=true;render()},onErr);
  setTimeout(()=>{const r=S.ready;if(!(r.proyectos&&r.escrituras&&r.servicios&&r.config)){S.timeout=true;render()}},10000);
})();
})();
</script>
