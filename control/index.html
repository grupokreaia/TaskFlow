<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F94C1B"><title>Grupo Krea Capital · Control administrativo</title>
<link rel="icon" href="../icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: barra lateral con un panel por proceso + área de trabajo con pestañas y tablas densas.
   Paleta: verde-azulado profundo sobre neutros con matiz verde; estados con colores propios. */
:root{
  --bg:#F2F6F4; --surface:#FFFFFF; --surface2:#E9F0ED; --ink:#13201C; --ink2:#42534D; --muted:#6B7C76; --line:#D3DDD9;
  --accent:#0B6B5D; --accent-ink:#FFFFFF; --accent-soft:#D5ECE6;
  --ok:#17703F; --ok-bg:#DBF0E3; --warn:#85560A; --warn-bg:#F8EBC6; --hi:#9A430A; --hi-bg:#FBE1CF;
  --bad:#A5231B; --bad-bg:#F7D9D6; --info:#1B5799; --info-bg:#DAE7F5;
  --shadow:0 1px 2px rgba(19,32,28,.07);
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1614; --surface:#15221F; --surface2:#1B2C28; --ink:#E5EEEB; --ink2:#A8B9B4; --muted:#7B8D87; --line:#2A3B36;
  --accent:#4FC2AE; --accent-ink:#04211C; --accent-soft:#163A33;
  --ok:#6FD39A; --ok-bg:#143626; --warn:#E8BC5A; --warn-bg:#3A2E0F; --hi:#F2A672; --hi-bg:#3F2412;
  --bad:#F28C84; --bad-bg:#432220; --info:#8DBAF0; --info-bg:#172E49; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1614; --surface:#15221F; --surface2:#1B2C28; --ink:#E5EEEB; --ink2:#A8B9B4; --muted:#7B8D87; --line:#2A3B36;
  --accent:#4FC2AE; --accent-ink:#04211C; --accent-soft:#163A33;
  --ok:#6FD39A; --ok-bg:#143626; --warn:#E8BC5A; --warn-bg:#3A2E0F; --hi:#F2A672; --hi-bg:#3F2412;
  --bad:#F28C84; --bad-bg:#432220; --info:#8DBAF0; --info-bg:#172E49; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);margin:0;padding:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;max-width:1440px;margin:0 auto;padding-block:20px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-size:18px;font-weight:600;letter-spacing:-.02em}
.brand span{color:var(--muted);font-size:12.5px}
.mods{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.mod{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:9px 10px;cursor:pointer;color:var(--ink2)}
.mod:hover{background:var(--surface2)}
.mod[aria-current="page"]{background:var(--accent-soft);color:var(--ink);border-color:transparent;font-weight:500}
.mod .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.mod[aria-current="page"] .dot,.mod.live .dot{background:var(--accent)}
.mod .tag{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
.mod .cnt{margin-left:auto;font-size:11px;font-family:var(--mono);padding:1px 7px;border-radius:99px;background:var(--bad-bg);color:var(--bad)}
.store{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.store i{width:8px;height:8px;border-radius:50%;background:var(--ok);margin-top:5px;flex:none}
.store.local i{background:var(--warn)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.main{min-width:0;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.head h1{font-size:24px}
.head p{margin:4px 0 0;color:var(--ink2)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 10px;font-size:12.5px;box-shadow:none}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.tab .cnt{font-size:11px;font-family:var(--mono);padding:0 6px;border-radius:99px;background:var(--surface2);color:var(--ink2)}
.tab .cnt.bad{background:var(--bad-bg);color:var(--bad)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-family:var(--mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{font-size:12.5px;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h2{font-size:15px;margin-bottom:12px}
.card .sub{color:var(--muted);font-size:12.5px;margin:-6px 0 12px}

.prog{display:flex;flex-direction:column;gap:5px;padding:8px 0}
.prog+.prog{border-top:1px solid var(--line)}
.prog-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.prog-top .nm{font-weight:500}
.track{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.fill{height:100%;border-radius:4px;background:var(--accent)}
.fill.over{background:var(--bad)}

.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--surface2);white-space:nowrap;position:sticky;top:0}
tbody tr:hover td{background:color-mix(in srgb,var(--surface2) 55%,transparent)}
tfoot td{font-weight:600;background:var(--surface2);border-bottom:0}
td.n,th.n{text-align:right}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td .small{display:block;font-size:11.5px;color:var(--muted)}
td .small.warn{color:var(--hi);font-weight:500}
.wrap{min-width:180px;max-width:320px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;white-space:nowrap}
.pill.c{background:var(--bad-bg);color:var(--bad)}
.pill.a{background:var(--hi-bg);color:var(--hi)}
.pill.m{background:var(--warn-bg);color:var(--warn)}
.pill.b{background:var(--surface2);color:var(--ink2)}
.pill.i{background:var(--info-bg);color:var(--info)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.cell-in{width:62px;text-align:right;font-family:var(--mono);border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--bg)}
.cell-in:hover{border-color:var(--accent)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.toolbar .grp{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{background:var(--info-bg);color:var(--info);border-radius:8px;padding:10px 12px;font-size:13px}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:28px 20px;text-align:center;color:var(--ink2);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-size:15px}

.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.alert b{display:block;margin-bottom:2px}
.alert span.d{color:var(--ink2);font-size:13px}
.sevhead{margin:10px 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}

.chart{width:100%;height:auto;display:block}
.chart .ax{fill:var(--muted);font:12px var(--mono)}
.chart .val{fill:var(--ink2);font:12px var(--mono)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--accent)}
.chart .base{stroke:var(--muted);stroke-width:1}

.overlay{position:fixed;inset:0;background:rgba(5,12,10,.55);display:grid;place-items:start center;overflow:auto;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:100%;max-width:680px;margin-block:auto;display:flex;flex-direction:column}
.modal header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}
.modal header h2{font-size:17px}
.modal .body{padding:18px 20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.modal footer .r{display:flex;gap:8px;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label,.fld .lb{font-weight:500;font-size:13px}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);width:100%;min-width:0}
.fld textarea{min-height:64px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.hint{font-size:12px;color:var(--muted)}
.err{font-size:12.5px;color:var(--bad);min-height:0}
.err:empty{display:none}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px}
.checks label{display:flex;gap:6px;align-items:center;font-weight:400}
.checks input{width:auto}
.preview{grid-column:1/-1;background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:var(--mono);font-size:12px;background:var(--accent-soft);color:var(--ink);padding:1px 7px;border-radius:6px}
.chip.dup{background:var(--bad-bg);color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:80;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.pending-card{max-width:640px}
.pending-card ul{margin:8px 0 0;padding-left:18px;color:var(--ink2)}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px}
  .side{position:static;gap:12px}
  .mods{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .mod{width:auto;white-space:nowrap;border-color:var(--line)}
  .mod .tag{display:none}
  .store{display:none}
  .modal .body{grid-template-columns:minmax(0,1fr)}
  .alert{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .3s}}
.back{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--accent);text-decoration:none;border:1px solid var(--accent-soft);background:var(--accent-soft);border-radius:99px;padding:5px 14px 5px 6px;width:max-content;min-height:36px;transition:background .15s,transform .15s}
.back:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.back:active{transform:scale(.97)}
.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.back .ic{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface);color:var(--accent);flex:none}
.back:hover .ic{background:rgba(255,255,255,.22);color:var(--accent-ink)}
.back .ic svg{width:14px;height:14px}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;justify-content:space-between;padding:8px max(20px,env(safe-area-inset-right,0px)) 8px max(20px,env(safe-area-inset-left,0px));padding-top:max(8px,env(safe-area-inset-top,0px));background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tb-title{display:flex;flex-direction:column;line-height:1.15;min-width:0;flex:1}
.tb-title b{font-size:16px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title span{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{display:flex;align-items:center;gap:9px;padding:3px 12px 3px 3px;border:1px solid var(--line);border-radius:99px;background:var(--surface);max-width:46vw;flex:none}
.who[hidden]{display:none}
.who .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600;overflow:hidden;flex:none;background:var(--accent)}
.who .av img{width:100%;height:100%;object-fit:cover;display:block}
.who .tx{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.who .tx b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .tx span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctas{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.cta{border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:99px;padding:6px 14px;cursor:pointer;white-space:nowrap;font-size:13px}
.cta:hover{border-color:var(--accent)}
.cta[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.cta.add{border-style:dashed;background:none}
@media (max-width:860px){
  .topbar{padding-inline:max(12px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-right,0px));gap:8px}
  .tb-title span{display:none}
  .tb-title b{font-size:15px}
  .back .bt small{display:none}
  .who .tx span{display:none}
  .who{max-width:44vw;padding-right:9px}
  .shell{padding-inline:12px!important;padding-block:12px!important;gap:12px!important}
  .side .brand{display:none}
  .head{align-items:flex-start;gap:8px 12px}
  .head h1{font-size:20px}
  .head p{font-size:13px}
  .head .actions{width:100%;display:flex;gap:8px;flex-wrap:wrap}
  .head .actions .btn{flex:1 1 auto;justify-content:center}
  .toolbar{gap:8px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kpi .v{font-size:1.02rem!important;white-space:nowrap}
  .kpi{padding:10px 12px}
}
@media (max-width:520px){.tb-title{display:none}.who{margin-left:auto;max-width:56vw}}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px;text-align:center}
#gate .box{max-width:420px;display:flex;flex-direction:column;gap:12px;align-items:center}
#gate[hidden]{display:none}
#gate h1{font-size:20px;margin:0}#gate p{margin:0;color:var(--ink2)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sinsust{display:inline-block;background:#3A2E0F;color:#FFD43B;font-weight:700;font-size:11px;letter-spacing:.04em;padding:2px 8px;border-radius:6px;white-space:nowrap}
.adjrow{display:flex;flex-direction:column;gap:4px;padding:6px 0}
.adjrow input[type=url]{width:100%}
.chip a{color:inherit;text-decoration:underline}
.dl{display:grid;grid-template-columns:minmax(120px,36%) 1fr;margin:0;grid-column:1/-1;width:100%}
.dl dt{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:9px 12px 9px 0;border-bottom:1px solid var(--line)}
.dl dd{margin:0;padding:9px 0;border-bottom:1px solid var(--line);word-break:break-word}
.dl dd .small{display:block}
td.act{white-space:nowrap;text-align:right}
@media (max-width:760px){
 .scroll:has(.rec){overflow:visible;border:0;background:transparent}
 .rec thead{display:none}
 .rec,.rec tbody,.rec tfoot,.rec tr{display:block;width:100%}
 .rec tbody tr{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;margin-bottom:10px}
 .rec td{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border:0;padding:5px 0;text-align:right}
 .rec td[data-l]::before{content:attr(data-l);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;text-align:left;flex:0 0 38%;padding-top:2px}
 .rec td{flex-wrap:wrap}
 .rec td>.small,.rec td>.pill+.small{flex:0 0 100%;text-align:right;white-space:normal}
 .rec td>.pill{white-space:normal}
 .rec td.act{justify-content:flex-start;flex-wrap:wrap;gap:6px;padding-top:8px;border-top:1px solid var(--line);margin-top:4px}
 .rec td.act::before{display:none}
 .rec td:empty{display:none}
 .rec tfoot tr{display:flex;flex-wrap:wrap;gap:4px 14px;background:var(--surface2);border-radius:10px;padding:8px 12px}
 .rec tfoot td{display:block;padding:0;text-align:left}
}
td.act .btn+.btn{margin-left:4px}
@media (max-width:520px){.dl{grid-template-columns:1fr}.dl dt{border:0;padding:8px 0 0}.dl dd{padding:2px 0 8px}}
.lotgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.lotgrp{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.lotgrp .rg{color:var(--ink2);font-size:12.5px;word-break:break-word}
#modal2 .overlay{z-index:70}
.lotstat{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
</style>
</head><body>
<div id="gate"><div class="box"><p>Verificando acceso…</p></div></div>
<header class="topbar">

  <div class="tb-title"><b>Krea Control</b><span>Información de la empresa, un panel por proceso</span></div>

</header>

    <div class="store" id="store"></div>
  </aside>

</div>
<div id="modal"></div><div id="modal2"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* ---------- generador de .xlsx con estilos (colores, fuentes, bordes, combinaciones, fórmulas) ---------- */
const XLX=(()=>{
  const colL=n=>{let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s};
  const ref=(r,c)=>colL(c)+(r+1);
  const clean=s=>String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
  const ex=s=>clean(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const rgb=c=>'FF'+String(c).replace('#','').toUpperCase();
  const BUILTIN={'General':0,'0':1,'0.00':2,'#,##0':3,'#,##0.00':4,'@':49};

  function styles(){
    const fonts=[],fills=['<fill><patternFill patternType="none"/></fill>','<fill><patternFill patternType="gray125"/></fill>'],borders=['<border><left/><right/><top/><bottom/><diagonal/></border>'];
    const fmts=[],xfs=[],idx={f:new Map(),fi:new Map(),b:new Map(),n:new Map(),x:new Map()};
    const add=(list,map,xml)=>{if(map.has(xml))return map.get(xml);list.push(xml);map.set(xml,list.length-1);return list.length-1};
    const fontXml=f=>'<font>'+(f.b?'<b/>':'')+(f.i?'<i/>':'')+(f.u?'<u/>':'')+'<sz val="'+(f.sz||11)+'"/>'+(f.c?'<color rgb="'+rgb(f.c)+'"/>':'<color theme="1"/>')+'<name val="'+ex(f.n||'Calibri')+'"/><family val="2"/></font>';
    add(fonts,idx.f,fontXml({}));
    add(borders,idx.b,borders[0]);add(fills,idx.fi,fills[0]);
    const side=(t,s)=>s?'<'+t+' style="'+s.s+'"><color rgb="'+rgb(s.c||'000000')+'"/></'+t+'>':'<'+t+'/>';
    const norm=bd=>{if(!bd)return null;if(typeof bd==='string')bd={all:{s:bd}};
      const a=bd.all;const o=k=>bd[k]||(a?{s:a.s,c:a.c}:null);return {l:o('l'),r:o('r'),t:o('t'),b:o('b')}};
    function xf(s){
      s=s||{};const key=JSON.stringify(s);if(idx.x.has(key))return idx.x.get(key);
      const fo=add(fonts,idx.f,fontXml(s.font||{}));
      const fi=s.fill?add(fills,idx.fi,'<fill><patternFill patternType="solid"><fgColor rgb="'+rgb(s.fill)+'"/><bgColor indexed="64"/></patternFill></fill>'):0;
      const bn=norm(s.bd);const bo=bn?add(borders,idx.b,'<border>'+side('left',bn.l)+side('right',bn.r)+side('top',bn.t)+side('bottom',bn.b)+'<diagonal/></border>'):0;
      let nid=0;if(s.nf){if(BUILTIN[s.nf]!=null)nid=BUILTIN[s.nf];else{if(!idx.n.has(s.nf)){fmts.push(s.nf);idx.n.set(s.nf,163+fmts.length)}nid=idx.n.get(s.nf)}}
      const al=s.al||{};
      const alx=(al.h||al.v||al.w||al.ind)?'<alignment'+(al.h?' horizontal="'+al.h+'"':'')+(al.v?' vertical="'+al.v+'"':'')+(al.w?' wrapText="1"':'')+(al.ind?' indent="'+al.ind+'"':'')+'/>':'';
      const x='<xf numFmtId="'+nid+'" fontId="'+fo+'" fillId="'+fi+'" borderId="'+bo+'" xfId="0"'+(nid?' applyNumberFormat="1"':'')+' applyFont="1"'+(fi?' applyFill="1"':'')+(bo?' applyBorder="1"':'')+(alx?' applyAlignment="1">'+alx+'</xf>':'/>');
      xfs.push(x);idx.x.set(key,xfs.length-1);return xfs.length-1;
    }
    xf({});
    const xml=()=>'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
      +(fmts.length?'<numFmts count="'+fmts.length+'">'+fmts.map((f,i)=>'<numFmt numFmtId="'+(164+i)+'" formatCode="'+ex(f)+'"/>').join('')+'</numFmts>':'')
      +'<fonts count="'+fonts.length+'">'+fonts.join('')+'</fonts><fills count="'+fills.length+'">'+fills.join('')+'</fills><borders count="'+borders.length+'">'+borders.join('')+'</borders>'
      +'<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="'+xfs.length+'">'+xfs.join('')+'</cellXfs>'
      +'<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
    return {xf,xml};
  }

  function sheetXml(sh,st){
    const rows=sh.rows||[];let maxC=0;
    const rowXml=rows.map((row,ri)=>{
      if(!row&&!(sh.heights&&sh.heights[ri+1]))return '';
      let cs='';
      (row||[]).forEach((cell,ci)=>{
        if(cell==null)return;maxC=Math.max(maxC,ci+1);
        const o=(typeof cell==='object'&&!(cell instanceof Date))?cell:{v:cell};
        const s=st.xf(o.s),r=ref(ri,ci);
        if(o.f!=null){
          const v=o.v;
          if(typeof v==='number')cs+='<c r="'+r+'" s="'+s+'"><f>'+ex(o.f)+'</f><v>'+v+'</v></c>';
          else cs+='<c r="'+r+'" s="'+s+'" t="str"><f>'+ex(o.f)+'</f><v>'+ex(v==null?'':v)+'</v></c>';
        }else if(typeof o.v==='number'&&isFinite(o.v))cs+='<c r="'+r+'" s="'+s+'"><v>'+o.v+'</v></c>';
        else if(o.v==null||o.v==='')cs+='<c r="'+r+'" s="'+s+'"/>';
        else cs+='<c r="'+r+'" s="'+s+'" t="inlineStr"><is><t xml:space="preserve">'+ex(o.v)+'</t></is></c>';
      });
      const h=sh.heights&&sh.heights[ri+1];
      return '<row r="'+(ri+1)+'"'+(h?' ht="'+h+'" customHeight="1"':'')+'>'+cs+'</row>';
    }).join('');
    const cols=(sh.cols||[]).map((w,i)=>w?'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>':'').join('');
    const dim='A1:'+ref(Math.max(rows.length-1,0),Math.max(maxC-1,0));
    const pane=sh.freeze?'<pane'+(sh.freeze.c?' xSplit="'+sh.freeze.c+'"':'')+(sh.freeze.r?' ySplit="'+sh.freeze.r+'"':'')+' topLeftCell="'+ref(sh.freeze.r,sh.freeze.c)+'" activePane="'+(sh.freeze.r&&sh.freeze.c?'bottomRight':sh.freeze.r?'bottomLeft':'topRight')+'" state="frozen"/>':'';
    const dv=(sh.validations||[]).length?'<dataValidations count="'+sh.validations.length+'">'+sh.validations.map(v=>'<dataValidation type="list" allowBlank="1" showErrorMessage="1" sqref="'+v.sqref+'"><formula1>"'+ex(v.list.join(','))+'"</formula1></dataValidation>').join('')+'</dataValidations>':'';
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
      +'<sheetPr>'+(sh.tab?'<tabColor rgb="'+rgb(sh.tab)+'"/>':'')+'<pageSetUpPr fitToPage="1"/></sheetPr><dimension ref="'+dim+'"/>'
      +'<sheetViews><sheetView workbookViewId="0"'+(sh.hideGrid?' showGridLines="0"':'')+(sh.zoom?' zoomScale="'+sh.zoom+'"':'')+(sh.first?' tabSelected="1"':'')+'>'+pane+'</sheetView></sheetViews>'
      +'<sheetFormatPr defaultRowHeight="15"/>'+(cols?'<cols>'+cols+'</cols>':'')+'<sheetData>'+rowXml+'</sheetData>'
      +((sh.merges||[]).length?'<mergeCells count="'+sh.merges.length+'">'+sh.merges.map(m=>'<mergeCell ref="'+m+'"/>').join('')+'</mergeCells>':'')
      +dv+'<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/><pageSetup orientation="'+(sh.landscape===false?'portrait':'landscape')+'" fitToWidth="1" fitToHeight="0"/></worksheet>';
  }

  async function build(sheets,JSZip){
    const st=styles();const names=[];
    sheets.forEach((s,i)=>{
      let n=clean(s.name||('Hoja'+(i+1))).replace(/[\[\]:*?\/\\]/g,' ').trim().slice(0,31)||('Hoja'+(i+1));
      let base=n,k=2;while(names.some(x=>x.toLowerCase()===n.toLowerCase())){const suf=' ('+k+')';n=base.slice(0,31-suf.length)+suf;k++}
      names.push(n);s.first=i===0;
    });
    const zip=new JSZip();
    zip.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map((_,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+'</Types>');
    zip.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
    zip.file('xl/workbook.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView/></bookViews><sheets>'+names.map((n,i)=>'<sheet name="'+ex(n)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets><calcPr fullCalcOnLoad="1"/></workbook>');
    zip.file('xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((_,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+'<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');
    sheets.forEach((s,i)=>zip.file('xl/worksheets/sheet'+(i+1)+'.xml',sheetXml(s,st)));
    zip.file('xl/styles.xml',st.xml());
    return zip.generateAsync({type:'uint8array',compression:'DEFLATE'});
  }
  /* fecha ISO (aaaa-mm-dd) -> número de serie de Excel */
  const serial=iso=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||''))return null;const [y,m,d]=iso.split('-').map(Number);return Math.round((Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/864e5)};
  return {build,serial,ref,colL};
})();
if(typeof module!=='undefined')module.exports=XLX;

  mode:'db',cache:{},listeners:{},queue:{},chan:null,timer:null,
  async init(){this.mode='db'},
  async _load(coll){

  watch(coll,cb,onErr){

function parseLotes(str){
  if(str==null||str==='')return [];
  const s=String(str).toUpperCase().replace(/\bY\b|&|;|\//g,',');
  const out=[];
  s.split(',').forEach(part=>{
    part=part.trim();if(!part)return;
    const m=part.match(/^(\d+)\s*(?:-|AL|A)\s*(\d+)$/);
    if(m){const a=+m[1],b=+m[2];if(b>=a&&b-a<300){for(let i=a;i<=b;i++)out.push(String(i));return}}
    out.push(part.replace(/\s+/g,''));
  });
  return Array.from(new Set(out));
}

const nzU=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const ubFind=(list,v)=>{const n=nzU(v);return list.find(x=>nzU(x)===n)||''};
function ubOpts(list,val,ph){
  const m=ubFind(list,val);
  let h='<option value="">'+ph+'</option>'+list.map(x=>`<option value="${esc(x)}" ${x===m?'selected':''}>${esc(x)}</option>`).join('');
  if(val&&!m)h+=`<option value="${esc(val)}" selected>${esc(val)} (valor anterior)</option>`;
  return h;
}
function ubProvs(dep){const d=ubFind(Object.keys(UBIGEO),dep);return d?Object.keys(UBIGEO[d]):[]}
function ubDists(dep,prov){const d=ubFind(Object.keys(UBIGEO),dep);if(!d)return[];const p=ubFind(Object.keys(UBIGEO[d]),prov);return p?UBIGEO[d][p]:[]}
function ubCascade(id){
  const dep=gv('p-departamento');
  if(id==='p-departamento'){
    $('#p-provincia').innerHTML=ubOpts(ubProvs(dep),'','Selecciona provincia');
    $('#p-distrito').innerHTML=ubOpts([],'','Selecciona distrito');
  }else if(id==='p-provincia'){
    $('#p-distrito').innerHTML=ubOpts(ubDists(dep,gv('p-provincia')),'','Selecciona distrito');
  }
  $('#p-provincia').disabled=!dep;
  $('#p-distrito').disabled=!gv('p-provincia');
}
const ubic=p=>[p.referencia,p.distrito,p.provincia,p.departamento].filter(Boolean).join(', ');
const tipoTxt=p=>(p.tipos||[]).map(t=>t==='Otros'&&p.tipoOtro?p.tipoOtro:t).join(' y ');
const adqTxt=p=>p.fechaAdq?fdate(p.fechaAdq):(p.anioAdq?String(p.anioAdq):'');

function compute(){
  const cfg=S.cfg,yrs=years();
  const projById={};S.proyectos.forEach(p=>projById[p.id]=p);
  const pName=id=>projById[id]?projById[id].nombre:'(proyecto eliminado)';
  const esc=S.escrituras.map(e=>{const l=parseLotes(e.lotes);const imp=num(e.importe)||0;return {...e,_l:l,_n:l.length,_imp:imp,_pl:l.length?imp/l.length:null}});
  esc.sort((a,b)=>cmpTxt(a.fecha,b.fecha)||cmpTxt(pName(a.proyectoId),pName(b.proyectoId))||cmpTxt(a.nroEscritura||'',b.nroEscritura||'')||cmpTxt(zonaTxt(a),zonaTxt(b))||cmpTxt(a._l[0],b._l[0]));
  const seen={};
  const key=(e,l)=>e.proyectoId+'|'+zonaKey(e)+'|'+l;
  esc.forEach(e=>e._l.forEach(l=>{(seen[key(e,l)]=seen[key(e,l)]||[]).push(e.id)}));
  esc.forEach(e=>{e._dup=e._l.filter(l=>seen[key(e,l)].length>1);e._fuera=!!e.fecha&&(e.fecha<cfg.periodoDesde||e.fecha>cfg.periodoHasta)});
  const grp={};esc.forEach(e=>{const n=String(e.nroEscritura||'').trim();e._nro=n;if(n){const k=e.proyectoId+'|'+n.toUpperCase();(grp[k]=grp[k]||[]).push(e)}});
  esc.forEach(e=>{const g=e._nro?grp[e.proyectoId+'|'+e._nro.toUpperCase()]:null;e._grp=g?g.length:1;e._fechasDist=g?new Set(g.map(x=>x.fecha)).size>1:false});
  const byProj={};esc.forEach(e=>{(byProj[e.proyectoId]=byProj[e.proyectoId]||[]).push(e)});
  Object.keys(byProj).forEach(id=>{
    const lots=byProj[id].reduce((a,e)=>a+e._n,0),imp=byProj[id].reduce((a,e)=>a+e._imp,0);
    const avg=lots?imp/lots:null;
    byProj[id].forEach(e=>{e._dev=(avg&&e._pl!=null&&lots>=4)?e._pl/avg-1:null});
  });
  const M={};
  S.proyectos.forEach(p=>{
    const le=byProj[p.id]||[];
    const byY={};yrs.forEach(y=>{byY[y]=0});let sin=0;
    le.forEach(e=>{const y=e.fecha?Number(String(e.fecha).slice(0,4)):null;if(y!=null&&y in byY)byY[y]+=e._n;else sin+=e._n});
    const sumY=yrs.reduce((a,y)=>a+byY[y],0),total=num(p.lotesTotal)||0,vend=sumY+sin;
    M[p.id]={vend,total,pend:total-vend,avance:total?vend/total:0,sumY,sin,byY,escN:vend,escImp:le.reduce((a,e)=>a+e._imp,0)};
  });
  const lotProjs=S.proyectos.filter(esLote);
  const T={proy:S.proyectos.length,
    invPEN:S.proyectos.filter(p=>p.moneda!=='USD').reduce((a,p)=>a+(num(p.importe)||0),0),
    invUSD:S.proyectos.filter(p=>p.moneda==='USD').reduce((a,p)=>a+(num(p.importe)||0),0),
    total:lotProjs.reduce((a,p)=>a+M[p.id].total,0),vend:lotProjs.reduce((a,p)=>a+M[p.id].vend,0),
    escN:esc.reduce((a,e)=>a+e._n,0),escImp:esc.reduce((a,e)=>a+e._imp,0)};
  T.pend=T.total-T.vend;T.avance=T.total?T.vend/T.total:0;T.pl=T.escN?T.escImp/T.escN:0;
  const porMes={};esc.forEach(e=>{if(e.fecha){const k=e.fecha.slice(0,7);porMes[k]=(porMes[k]||0)+e._imp}});
  const mzMap={};esc.forEach(e=>{const k=e.proyectoId+'|'+zonaKey(e);const o=mzMap[k]=mzMap[k]||{pid:e.proyectoId,mz:zonaTxt(e).toUpperCase(),n:0,imp:0,lotes:[]};o.n+=e._n;o.imp+=e._imp;o.lotes.push(...e._l)});
  const porMz=Object.values(mzMap).sort((a,b)=>cmpTxt(pName(a.pid),pName(b.pid))||cmpTxt(a.mz,b.mz));
  const C={esc,M,T,porMes,porMz,projById,pName,lotProjs};
  C.alerts=buildAlerts(C);
  return C;
}

function buildAlerts(C){
  const A=[],cfg=S.cfg,py=periodYear();
  const add=(sev,t,d,go)=>A.push({sev,t,d,go});
  C.lotProjs.forEach(p=>{
    const m=C.M[p.id];
    if(!m.total)add('a',p.nombre+': falta el total de lotes','Sin el total no se calculan los lotes pendientes.',{tab:'lotes'});
    if(m.pend<0)add('c',p.nombre+': hay más lotes vendidos que lotes totales','Vendidos '+m.vend+' y total '+m.total+'.',{tab:'lotes'});
    if(m.sin>0)add('a',p.nombre+': '+m.sin+' lotes con escritura sin fecha o fuera de los años del cuadro','Revisa la fecha de esas escrituras: el cuadro por año se llena solo con la fecha de cada escritura.',{tab:'escrituras'});
    const first=num(p.anioInicio)||num(p.anioAdq);
    const early=years().filter(y=>first&&y<first&&(m.byY[y]||0)>0);
    if(early.length)add('m',p.nombre+': ventas en años anteriores al inicio del proyecto','Hay escrituras en '+early.join(', ')+' y el proyecto empieza en '+first+'.',{tab:'escrituras'});
  });
  S.proyectos.forEach(p=>{
    if(!(p.tipos||[]).length)add('m',p.nombre+': falta el tipo de proyecto','Marca al menos una opción.',{edit:{k:'p',id:p.id}});
    if(!(num(p.importe)>0))add('a',p.nombre+': falta el importe de la compra','',{edit:{k:'p',id:p.id}});
    if(!p.fechaAdq)add('m',p.nombre+': la fecha de adquisición tiene solo el año ('+(p.anioAdq||'sin dato')+')','La solicitud pide la fecha de adquisición. Regístrala completa.',{edit:{k:'p',id:p.id}});
    if(p.monedaConfirmada!==true)add('m',p.nombre+': moneda sin confirmar','El encabezado del formato dice soles (S/), pero el importe estaba con formato de dólar en el Excel. Confirma la moneda.',{edit:{k:'p',id:p.id}});
    if(esLote(p)&&!(p.departamento&&p.provincia&&p.distrito))add('m',p.nombre+': ubicación incompleta','Completa departamento, provincia y distrito.',{edit:{k:'p',id:p.id}});
    if(esLote(p)){const nd=ldet(p).length,tt=num(p.lotesTotal)||0;
      if(!nd)add('m',p.nombre+': faltan registrar los lotes','Registra las manzanas o etapas y los lotes del proyecto. Así las escrituras se cargan eligiendo el lote de una lista, sin errores de digitación.',{edit:{k:'p',id:p.id}});
      else if(nd!==tt)add('m',p.nombre+': los lotes registrados ('+nd+') no coinciden con el total ('+tt+')','Completa o corrige la lista de lotes del proyecto.',{edit:{k:'p',id:p.id}});}
    if(p.modalidad==='otro'&&!p.modalidadDetalle)add('b',p.nombre+': falta especificar la modalidad "Otro"','',{edit:{k:'p',id:p.id}});
    if(p.pendienteRegistro)add('a',p.nombre+': escrituras sin inscribir en Registros Públicos','Aclara si la escritura pública está firmada y cuándo se elevará a registro. La solicitud pide ventas con escritura.',{edit:{k:'p',id:p.id}});
    if(p.notaImport)add('i',p.nombre+': corrección respecto al Excel',p.notaImport,{edit:{k:'p',id:p.id}});
  });
  C.esc.forEach(e=>{
    const nm=C.pName(e.proyectoId),ref=nm+(zonaTxt(e)?' · '+zonaTxt(e):'')+' · lote '+(e.lotes||'?');
    if(e._dup.length)add('c','Lote repetido: '+nm+(zonaTxt(e)?' · '+zonaTxt(e):'')+' · '+e._dup.join(', '),'Está registrado en más de una escritura (escritura del '+fdate(e.fecha)+').',{edit:{k:'e',id:e.id}});
    {const P=S.proyectos.find(x=>x.id===e.proyectoId);
     if(P&&ldet(P).length&&e._l.length===1&&!ldet(P).some(d=>lkey(d.t,d.z,d.l)===lkey(zonaTipo(e),e.mz,e._l[0])))add('m','Lote fuera de la lista del proyecto: '+ref,'Esa manzana o etapa y ese lote no están en los lotes registrados del proyecto. Corrígelo o actualiza la lista de lotes.',{edit:{k:'e',id:e.id}});}
    if(e._fuera)add('m','Escritura fuera del periodo: '+ref,'Fecha '+fdate(e.fecha)+'; el periodo es '+fdate(cfg.periodoDesde)+' al '+fdate(cfg.periodoHasta)+'.',{edit:{k:'e',id:e.id}});
    if(e._n===0)add('a','Escritura sin lotes válidos: '+ref,'',{edit:{k:'e',id:e.id}});
    if(e._n>1)add('m','Registro con varios lotes: '+ref,'Cada registro debe ser de un solo lote. Edítalo, deja un lote y agrega los demás con la misma escritura.',{edit:{k:'e',id:e.id}});

    if(e._dev!=null&&Math.abs(e._dev)>0.45)add('b','Precio por lote atípico: '+ref,money(e._pl,'PEN',0)+' por lote, '+(e._dev>0?'+':'')+Math.round(e._dev*100)+'% frente al promedio del proyecto. Verifica el importe.',{edit:{k:'e',id:e.id}});

  if(cfg.serviciosAplica&&!S.servicios.length)add('b','Servicios: indicaste que aplica, pero no hay servicios registrados','',{tab:'servicios'});
  A.sort((a,b)=>SEV[a.sev].o-SEV[b.sev].o);

}

/* ================= KARDEX DE REGALOS ================= */
const KCOLS={cat:'kdx_catalogo',mov:'kdx_movimientos',cfg:'kdx_config'};
const KDEF={empresa:'',ruc:'',responsable:'',igv:18};
const KTABS=[['resumen','Resumen'],['movimientos','Movimientos'],['stock','Stock'],['catalogo','Catálogo'],['calidad','Control de calidad']];
const KSUST=['FACTURA','BOLETA','ACTA DE ENTREGA','CONSTANCIA','BOLETA / ACTA','NOTA INTERNA','OTRO'];
const KADJ=['Comprobante (PDF)','XML','Acta o constancia','Fotografía'];
const KUNID=['UND','CJA','PAR','JGO','KG','LT','MT'];
S.k={cat:[],mov:[],cfg:{...KDEF},ready:{},tab:'resumen',fprod:'',ftipo:'',fq:''};
S.KC=null;
const slug=c=>String(c).trim().toUpperCase().replace(/[^A-Z0-9_\-.~:@+]/g,'_');
const kcode=c=>String(c||'').trim().toUpperCase();
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const igvRate=()=>{const v=num(S.k.cfg.igv);return (v==null?18:v)/100};
function validDoc(v){
  v=String(v||'').trim();
  if(/^\d{8}$/.test(v))return 'DNI';
  if(/^\d{11}$/.test(v)){
    const w=[5,4,3,2,7,6,5,4,3,2];let s=0;for(let i=0;i<10;i++)s+=Number(v[i])*w[i];
    const r=11-(s%11),dv=r>=10?r-10:r;
    return (dv===Number(v[10])&&['10','15','16','17','20'].includes(v.slice(0,2)))?'RUC':null;
  }
  return null;
}
function collFor(k){return k==='bj'?BCOLS.caja:k==='bm'?BCOLS.mov:k==='ac'?ACOLS.con:k==='kp'?KCOLS.cat:k==='km'?KCOLS.mov:k==='p'?COLS.proyectos:k==='e'?COLS.escrituras:COLS.servicios}
function kUsed(id){const c=S.k.cat.find(x=>x.id===id);return !!c&&S.k.mov.some(m=>kcode(m.codigo)===kcode(c.codigo))}

function computeK(){
  const K=S.k;
  const catBy={};K.cat.forEach(c=>{catBy[kcode(c.codigo)]=c});
  const movs=K.mov.map(m=>({...m,_q:num(m.cantidad)||0}))
    .sort((a,b)=>cmpTxt(a.fecha,b.fecha)||((num(a.ts)||0)-(num(b.ts)||0))||cmpTxt(a.id,b.id));
  const ps={};
  movs.forEach((m,i)=>{
    m._i=i+1;const code=kcode(m.codigo);
    const st=ps[code]=ps[code]||{q:0,val:0,ent:0,sal:0,valEnt:0,valSal:0,last:0};
    if(m.tipo==='ENTRADA'){
      m._cost=num(m.costoUnit)||0;m._val=m._q*m._cost;
      st.val+=m._val;st.q+=m._q;st.ent+=m._q;st.valEnt+=m._val;
      if(st.q>0)st.last=st.val/st.q;
    }else{
      const avg=st.q>0?st.val/st.q:st.last;
      m._cost=avg;m._val=m._q*avg;
      st.val-=m._val;st.q-=m._q;st.sal+=m._q;st.valSal+=m._val;
      if(st.q===0)st.val=0;
    }
    m._stock=st.q;
  });
  const codes=new Set([...Object.keys(catBy),...Object.keys(ps)]);
  const rows=[...codes].map(code=>{
    const c=catBy[code],st=ps[code]||{q:0,val:0,ent:0,sal:0,valEnt:0,valSal:0,last:0};
    const min=c?(num(c.stockMin)||0):0,q=st.q,avg=q>0?st.val/q:st.last;
    let est='OK';
    if(!(st.ent||st.sal))est='Sin movimientos';else if(q<0)est='Revisar';else if(q<=min)est='Stock mínimo';
    return {codigo:c?c.codigo:code,desc:c?c.descripcion:'(no está en el catálogo)',marca:c?(c.marca||''):'',unidad:c?(c.unidad||'UND'):'UND',min,ent:st.ent,sal:st.sal,q,avg,val:Math.max(0,st.val),valSal:st.valSal,est,enCat:!!c,id:c?c.id:null};
  }).sort((a,b)=>cmpTxt(a.codigo,b.codigo));
  const rowBy={};rows.forEach(r=>{rowBy[kcode(r.codigo)]=r});
  const T={prod:K.cat.length,ent:rows.reduce((a,r)=>a+r.ent,0),sal:rows.reduce((a,r)=>a+r.sal,0),stock:rows.reduce((a,r)=>a+Math.max(0,r.q),0),valStock:rows.reduce((a,r)=>a+r.val,0),valSal:rows.reduce((a,r)=>a+r.valSal,0),movs:movs.length};
  const porMes={};const pp={};const clientes={};
  movs.forEach(m=>{
    if(m.tipo==='SALIDA'){
      if(m.fecha){const k=m.fecha.slice(0,7);porMes[k]=(porMes[k]||0)+m._val}
      const nm=m.proyecto||'(sin proyecto)';const o=pp[nm]=pp[nm]||{n:0,val:0,cli:new Set()};
      o.n+=m._q;o.val+=m._val;if(m.docCliente)o.cli.add(m.docCliente);
      if(m.docCliente&&m.cliente)clientes[String(m.docCliente).trim()]=m.cliente;
    }
  });
  const porProy=Object.keys(pp).map(k=>({nombre:k,n:pp[k].n,val:pp[k].val,cli:pp[k].cli.size})).sort((a,b)=>b.val-a.val);
  const KC={movs,rows,rowBy,catBy,T,porMes,porProy,clientes};
  KC.alerts=alertsK(KC);
  return KC;
}

function alertsK(KC){
  const A=[],add=(sev,t,d,go)=>A.push({sev,t,d,go}),cfg=S.k.cfg,today=hoy();
  KC.rows.forEach(r=>{
    const nm=r.codigo+' · '+r.desc;
    if(!r.enCat)add('a','El código '+r.codigo+' tiene movimientos, pero no está en el catálogo','Agrégalo al catálogo para ver su descripción y su stock mínimo.',{tab:'catalogo'});
    if(r.est==='Revisar')add('c',nm+': stock negativo ('+nf(r.q)+')','Se entregó más de lo que ingresó. Revisa las fechas y las cantidades de sus movimientos.',{tab:'movimientos',prod:r.codigo});
    else if(r.est==='Stock mínimo')add('m',nm+': llegó al stock mínimo','Quedan '+nf(r.q)+' y el mínimo es '+nf(r.min)+'. Conviene reponer.',{tab:'stock'});
    if(r.enCat&&r.est!=='Sin movimientos'&&!(r.min>0))add('b',nm+': sin stock mínimo definido','Define un mínimo en el Catálogo para recibir el aviso antes de que se agote.',{tab:'catalogo'});
  });
  const dupKey={};
  KC.movs.forEach(m=>{const k=m.tipo+'|'+String(m.nroDoc||'').trim().toUpperCase()+'|'+kcode(m.codigo);(dupKey[k]=dupKey[k]||[]).push(m.id)});
  KC.movs.forEach(m=>{
    const ref=(m.tipo==='ENTRADA'?'Compra':'Entrega')+' del '+fdate(m.fecha)+' · '+m.codigo;
    const go={edit:m.id};
    if(!String(m.nroDoc||'').trim())add('a',ref+': falta el número de documento','',go);
    else if(dupKey[m.tipo+'|'+String(m.nroDoc).trim().toUpperCase()+'|'+kcode(m.codigo)].length>1)add('a',ref+': documento repetido ('+m.nroDoc+')','El mismo documento está registrado más de una vez para este producto.',go);
    if(m.tipo==='ENTRADA'&&!(m._cost>0))add('a',ref+': falta el costo unitario','',go);
    if(m.tipo==='SALIDA'){
      if(!m.proyecto)add('a',ref+': falta el proyecto','Toda entrega debe indicar a qué proyecto corresponde.',go);
      if(!m.lote)add('m',ref+': falta el lote','',go);
      if(!validDoc(m.docCliente))add('a',ref+': DNI o RUC del cliente no válido','',go);
      if(!String(m.cliente||'').trim())add('a',ref+': falta el nombre del cliente','',go);
      if(!(m._cost>0))add('m',ref+': entrega sin costo','El producto no tiene compras anteriores, así que el valor entregado sale en 0.',go);
    }
    if(!(m.adjuntos||[]).length)add('m',ref+': SIN SUSTENTO','Marca el sustento que tienes (comprobante, XML, acta o fotografía) y pega su enlace.',go);
    if(m.fecha>today)add('m',ref+': la fecha es futura','',go);
  });
  if(!String(cfg.empresa||'').trim()||!String(cfg.ruc||'').trim())add('b','Faltan los datos de la empresa','Completa empresa, RUC y responsable en Ajustes para que salgan en el Excel.',{settings:true});
  A.sort((a,b)=>SEV[a.sev].o-SEV[b.sev].o);
  return A;
}

function kTabBody(){switch(S.k.tab){case 'resumen':return kResumen();case 'movimientos':return kMovs();case 'stock':return kStock();case 'catalogo':return kCatalogo();case 'calidad':return kCalidad();}return ''}
const kEmpty=()=>`<div class="empty"><b>Empieza por el catálogo</b><span>Agrega los regalos que compras (código, descripción y marca). Después registras las compras y las entregas, y el stock se calcula solo.</span><button class="btn primary" data-act="k-new-p">Nuevo producto</button></div>`;
const estPill=e=>`<span class="pill ${e==='OK'?'ok':e==='Revisar'?'c':e==='Stock mínimo'?'m':'b'}">${e}</span>`;

function barChartK(items,aria){
  const max=Math.max(...items.map(i=>i.v),0),top=max>0?niceMax(max):1;
  const W=520,H=240,pl=56,pr=8,pt=26,pb=34,pw=W-pl-pr,ph=H-pt-pb,n=items.length,step=pw/n,bw=Math.min(40,step*.56);
  const sc=v=>pt+ph-(v/top)*ph,tick=v=>v>=1000?nf(v/1000)+' mil':nf(v,v<10&&v>0?1:0);
  let g='';
  [0,top/2,top].forEach(t=>{const y=sc(t);g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="ax" x="${pl-8}" y="${y+4}" text-anchor="end">${max>0?tick(t):''}</text>`});
  items.forEach((it,i)=>{
    const cx=pl+step*i+step/2,x=cx-bw/2;
    g+=`<text class="ax" x="${cx}" y="${H-12}" text-anchor="middle">${esc(it.l)}</text>`;
    if(it.v>0){const h=ph*(it.v/top),y=sc(it.v),r=Math.min(4,bw/2,h);
      g+=`<g><title>${esc(it.l)}: ${money(it.v)}</title><path class="bar" d="M${x},${y+h}L${x},${y+r}Q${x},${y} ${x+r},${y}L${x+bw-r},${y}Q${x+bw},${y} ${x+bw},${y+r}L${x+bw},${y+h}Z"/></g><text class="val" x="${cx}" y="${y-6}" text-anchor="middle">${nf(it.v)}</text>`;
    }else g+=`<text class="val" x="${cx}" y="${pt+ph-6}" text-anchor="middle" style="opacity:.55">-</text>`;
  });
  g+=`<line class="base" x1="${pl}" x2="${W-pr}" y1="${pt+ph}" y2="${pt+ph}"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">${g}</svg>`;
}

function kCalidad(){
  const KC=S.KC;
  if(!KC.alerts.length)return '<div class="empty"><b>Todo en orden</b><span>El stock cuadra y los movimientos tienen sus datos y su sustento.</span></div>';
  const counts={};KC.alerts.forEach(a=>counts[a.sev]=(counts[a.sev]||0)+1);
  const sum=Object.keys(SEV).filter(k=>counts[k]).map(k=>`<span class="pill ${k}">${SEV[k].n}: ${counts[k]}</span>`).join(' ');
  let html=`<div class="toolbar"><div class="grp">${sum}</div><span class="hint">Se recalcula solo cada vez que cambias un dato.</span></div><div class="alerts">`,cur='';
  KC.alerts.forEach((a,i)=>{
    if(a.sev!==cur){cur=a.sev;html+=`<div class="sevhead">${SEV[a.sev].n}</div>`}
    html+=`<div class="alert"><span class="pill ${a.sev}">${SEV[a.sev].n}</span><div><b>${esc(a.t)}</b>${a.d?`<span class="d">${esc(a.d)}</span>`:''}</div><button class="btn sm" data-act="k-go" data-i="${i}">Revisar</button></div>`;
  });
  return html+'</div>';
}

/* ================= ALQUILERES VIGENTES ================= */
const ACOLS={con:'alq_contratos',pag:'alq_pagos',cfg:'alq_config'};
const ADEF={empresa:'',ruc:'',fechaRef:'',diasAlerta:30};
const ATABS=[['resumen','Resumen'],['contratos','Contratos y adendas'],['pagos','Pagos por mes'],['calidad','Control de calidad']];
const ABIEN=['Inmueble','Vehículo','Maquinaria','Mueble','Otro'];
const AFORMA=['Transferencia','Depósito','Efectivo','Cheque','Otro'];
const ADOCS=['FACTURA','RECIBO DE ARRENDAMIENTO','OTRO'];
S.a={con:[],pag:[],cfg:{...ADEF},ready:{},tab:'resumen',fcon:'',fvig:'',fq:''};
S.AC=null;

const isoOf=d=>d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
const okIso=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'');
function addM(iso,n){
  const [y,m,d]=iso.split('-').map(Number);
  const last=new Date(Date.UTC(y,m-1+n+1,0)).getUTCDate();
  return isoOf(new Date(Date.UTC(y,m-1+n,Math.min(d,last))));
}
function eom(iso){const [y,m]=iso.split('-').map(Number);return isoOf(new Date(Date.UTC(y,m,0)))}
function dDiff(a,b){const f=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};return Math.round((f(b)-f(a))/864e5)}
const aRef=()=>okIso(S.a.cfg.fechaRef)?S.a.cfg.fechaRef:hoy();
const cur$=(n,c)=>money(n,c||'PEN',2);
const sugDoc=doc=>validDoc(doc)==='RUC'?'FACTURA':'RECIBO DE ARRENDAMIENTO';
const vigCls=v=>v==='Vigente'?'ok':v==='Por vencer'?'m':v==='Vencido'?'c':'b';
const cuoCls=e=>e==='Pagada'?'ok':e==='Vencida'?'c':'b';

function computeA(){
  const A=S.a,ref=aRef(),dias=num(A.cfg.diasAlerta)==null?30:num(A.cfg.diasAlerta);
  const pagBy={};A.pag.forEach(p=>{pagBy[p.id]=p});
  const con=A.con.map(c=>{
    const imp=num(c.importe)||0,meses=Math.max(0,Math.min(120,Math.round(num(c.meses)||0)));
    const ok=okIso(c.inicio)&&meses>0;
    const fin=ok?addM(c.inicio,meses):'';
    let vig='Sin fechas';
    if(ok){
      if(ref<c.inicio)vig='Por iniciar';
      else if(ref>=fin)vig='Vencido';
      else vig=dDiff(ref,fin)<=dias?'Por vencer':'Vigente';
    }
    const cuotas=[];
    if(ok)for(let n=1;n<=meses;n++){
      const per=addM(c.inicio,n-1),dev=eom(per),pg=pagBy[c.id+'_'+n]||{};
      const pagada=okIso(pg.fechaPago);
      const estado=pagada?'Pagada':(dev<ref?'Vencida':'Por pagar');
      const atraso=pagada?Math.max(0,dDiff(dev,pg.fechaPago)):(dev<ref?dDiff(dev,ref):0);
      cuotas.push({n,per,dev,renta:imp,fechaPago:pg.fechaPago||'',tipoDoc:pg.tipoDoc||'',fechaEm:pg.fechaEmision||'',serie:pg.serie||'',estado,atraso,pagada});
    }
    const pagadas=cuotas.filter(q=>q.pagada).length,venc=cuotas.filter(q=>q.estado==='Vencida');
    return {...c,_imp:imp,_meses:meses,_fin:fin,_vig:vig,_diasFin:fin?dDiff(ref,fin):null,cuotas,_pagadas:pagadas,_venc:venc,_total:imp*meses,_cobrado:imp*pagadas};
  }).sort((a,b)=>(a.tipoDoc===b.tipoDoc?0:a.tipoDoc==='ADENDA'?1:-1)||cmpTxt(a.nro,b.nro));
  const byId={};con.forEach(c=>{byId[c.id]=c});
  const vigentes=con.filter(c=>c._vig==='Vigente'||c._vig==='Por vencer');
  const renta={PEN:0,USD:0};vigentes.forEach(c=>{renta[c.moneda==='USD'?'USD':'PEN']+=c._imp});
  const deuda={PEN:0,USD:0};let nVenc=0;
  con.forEach(c=>c._venc.forEach(q=>{deuda[c.moneda==='USD'?'USD':'PEN']+=q.renta;nVenc++}));
  const T={n:con.filter(c=>c.tipoDoc!=='ADENDA').length,ad:con.filter(c=>c.tipoDoc==='ADENDA').length,vig:vigentes.length,pv:con.filter(c=>c._vig==='Por vencer').length,vc:con.filter(c=>c._vig==='Vencido').length,renta,deuda,nVenc};
  const AC={con,byId,T,ref};
  AC.alerts=alertsA(AC);
  return AC;
}

function alertsA(AC){
  const X=[],add=(sev,t,d,go)=>A_push(X,sev,t,d,go),cfg=S.a.cfg;
  const dup={};AC.con.forEach(c=>{const k=c.tipoDoc+'|'+String(c.nro||'').trim().toUpperCase();(dup[k]=dup[k]||[]).push(c.id)});
  AC.con.forEach(c=>{
    const nm=(c.tipoDoc==='ADENDA'?'Adenda ':'Contrato ')+(c.nro||'(sin número)')+' · '+(c.arrendador||'sin arrendador');
    const go={edit:c.id};
    if(!String(c.nro||'').trim())add('a',nm+': falta el número','',go);
    else if(dup[c.tipoDoc+'|'+String(c.nro).trim().toUpperCase()].length>1)add('a',nm+': número repetido','',go);
    if(!String(c.arrendador||'').trim())add('a',nm+': falta el arrendador','',go);
    if(!validDoc(c.doc))add('a',nm+': DNI o RUC del arrendador no válido','',go);
    if(c.bien==='Vehículo'&&!String(c.placa||'').trim())add('a',nm+': falta la placa del vehículo','',go);
    if(!(c._imp>0))add('a',nm+': falta el importe mensual','',go);
    if(!c._fin)add('a',nm+': faltan la fecha de inicio o el número de meses','',go);
    if(c.tipoDoc==='ADENDA'&&!(c.contratoRef&&AC.byId[c.contratoRef]))add('m',nm+': no indica a qué contrato corresponde','',go);
    if(c._vig==='Vencido'){
      const cubierto=AC.con.some(x=>x.tipoDoc==='ADENDA'&&x.contratoRef===c.id&&(x._vig==='Vigente'||x._vig==='Por vencer'));
      if(!cubierto&&c.tipoDoc!=='ADENDA')add('a',nm+': vencido el '+fdate(c._fin),'No corresponde listarlo como vigente. Confirma si hubo renovación y registra la adenda.',go);
    }
    if(c._vig==='Por vencer')add('m',nm+': vence el '+fdate(c._fin)+' ('+c._diasFin+' días)','Gestiona la renovación o la adenda a tiempo.',go);
    if(c._vig==='Por iniciar')add('b',nm+': todavía no inicia ('+fdate(c.inicio)+')','',go);
    if(c._venc.length){
      const m=c._venc.reduce((a,q)=>a+q.renta,0);
      add('a',nm+': '+c._venc.length+' cuota'+(c._venc.length>1?'s':'')+' vencida'+(c._venc.length>1?'s':'')+' sin pago ('+cur$(m,c.moneda)+')','La más antigua es de '+fdate(c._venc[0].dev)+'.',{pagos:c.id});
    }
    const sinCp=c.cuotas.filter(q=>q.pagada&&!String(q.serie).trim());
    if(sinCp.length)add('m',nm+': '+sinCp.length+' pago'+(sinCp.length>1?'s':'')+' sin serie y número de comprobante','',{pagos:c.id});
    const tipoMal=c.cuotas.filter(q=>q.tipoDoc&&q.tipoDoc!=='OTRO'&&validDoc(c.doc)&&q.tipoDoc!==sugDoc(c.doc));
    if(tipoMal.length)add('m',nm+': '+tipoMal.length+' comprobante'+(tipoMal.length>1?'s':'')+' no corresponde'+(tipoMal.length>1?'n':'')+' al tipo de arrendador','Con RUC se emite factura; con DNI, recibo de arrendamiento.',{pagos:c.id});
    const antes=c.cuotas.filter(q=>q.pagada&&q.fechaPago<c.inicio);
    if(antes.length)add('m',nm+': pago con fecha anterior al inicio del contrato','',{pagos:c.id});
  });
  if(!String(cfg.empresa||'').trim()||!String(cfg.ruc||'').trim())add('b','Faltan los datos de la empresa','Completa empresa y RUC en Ajustes para que salgan en el Excel.',{settings:true});
  X.sort((a,b)=>SEV[a.sev].o-SEV[b.sev].o);
  return X;
}
function A_push(X,sev,t,d,go){X.push({sev,t,d,go})}

  const A=S.a,r=A.ready,all=r.con&&r.pag&&r.cfg,AC=S.AC;

const aEmpty=()=>`<div class="empty"><b>Empieza registrando un contrato</b><span>Indica arrendador, fecha de inicio, número de meses e importe. El calendario de pagos, la fecha de término y la vigencia se calculan solos.</span><button class="btn primary" data-act="a-new" data-t="CONTRATO">Nuevo contrato</button></div>`;
const vigPill=v=>`<span class="pill ${vigCls(v)}">${v}</span>`;
const rentaTxt=r=>{const a=[];if(r.PEN)a.push(money(r.PEN));if(r.USD)a.push(money(r.USD,'USD'));return a.join(' + ')||'S/ 0.00'};

   <div class="kpi"><span class="l">Cuotas vencidas sin pago</span><span class="v" style="color:${T.nVenc?'var(--bad)':'var(--ok)'}">${T.nVenc}</span><span class="s">${T.nVenc?rentaTxt(T.deuda):'todo al día'}</span></div></div>`;

    <div class="track" role="img" aria-label="${esc(c.arrendador)}: ${c._pagadas} de ${c._meses} pagos"><div class="fill ${c._venc.length?'over':''}" style="width:${pct}%"></div></div></div>`}).join('');

}

function aContratos(){
  const A=S.a,AC=S.AC;

}

/* ================= MOVIMIENTOS BANCARIOS ================= */
const BCOLS={mov:'ban_movimientos',cfg:'ban_config',caja:'ban_caja'};
const BDEF={nombre:'',cajaSaldo:0,banco:'BBVA',cuenta:'',moneda:'PEN',empresa:'',ruc:'',saldoInicial:0,fechaInicial:'',itfPct:0.005,itfUmbral:1000,saldoEstado:'',fechaEstado:''};
const BTABS=[['resumen','Resumen'],['movimientos','Movimientos'],['conciliacion','Conciliación'],['caja','Caja chica'],['calidad','Control de calidad']];
const BOPS=[['ABONO TRANSFERENCIAS','I'],['DEPOSITO EN EFECTIVO','I'],['TRANSFERENCIA ENVIADA','E'],['PAGO FACTURA','E'],['PAGO DE SERVICIOS','E'],['COMPRA EN COMERCIO','E'],['COMISION','E'],['ITF','E'],['OTRO','E']];
const BDOCS=['','FACTURA','BOLETA','RECIBO POR HONORARIOS','RECIBO DE ARRENDAMIENTO','PLANILLA','VOUCHER','TICKET','ENTRE CUENTAS','NOTA DE CRÉDITO','OTROS'];
const BEXENTO=['ITF','COMISION'];
S.b={mov:[],all:[],cfgs:[],caja:[],cajaM:[],list:[],cta:'banco',cfg:{...BDEF},ready:{},tab:'resumen',fmes:'',fdir:'',fq:'',fsin:false};
S.BC=null;
const bCtaName=x=>x.nombre||((x.banco||'Cuenta')+(x.cuenta?' '+String(x.cuenta).slice(-4):''));
/* cuenta activa: S.b.cfg y S.b.mov salen de la cuenta o sede elegida */
function bSync(){
  const B=S.b;
  let list=B.cfgs.slice().sort((a,b)=>cmpTxt(bCtaName(a),bCtaName(b)));
  if(!list.length)list=[{id:'banco',...BDEF}];
  if(!list.some(x=>x.id===B.cta))B.cta=list[0].id;
  B.list=list;
  const cur=list.find(x=>x.id===B.cta),{id:_i,...rest}=cur;
  B.cfg={...BDEF,...rest};B.cfgId=cur.id;
  const first=list.some(x=>x.id==='banco')?'banco':list[0].id;
  B.mov=B.all.filter(m=>(m.cuentaId||first)===B.cta);
  B.cajaM=B.caja.filter(m=>(m.cuentaId||first)===B.cta);
}
function computeCaja(){
  const B=S.b,si=num(B.cfg.cajaSaldo)||0;
  const movs=B.cajaM.map(m=>({...m,_m:num(m.monto)||0})).sort((a,b)=>cmpTxt(a.fecha,b.fecha)||((num(a.ts)||0)-(num(b.ts)||0))||cmpTxt(a.id,b.id));
  let s=si,ing=0,egr=0;
  movs.forEach((m,i)=>{m._n=i+1;if(m.dir==='I'){s+=m._m;ing+=m._m}else{s-=m._m;egr+=m._m}m._saldo=Math.round(s*100)/100});
  const pend=movs.filter(m=>m.pendiente);
  return {movs,si,ing,egr,saldo:Math.round(s*100)/100,pend:pend.length,pendMonto:pend.reduce((a,m)=>a+m._m,0)};
}
const bMoneda=()=>S.b.cfg.moneda==='USD'?'USD':'PEN';
const bm=n=>money(n,bMoneda(),2);
const mesLbl=k=>{const [y,m]=k.split('-');return MES[Number(m)-1]+' '+y.slice(2)};
const sinComp=m=>!String(m.docTipo||'').trim()&&!BEXENTO.some(x=>String(m.tipoOp||'').toUpperCase().startsWith(x));
const itfCalc=monto=>{const c=S.b.cfg,u=num(c.itfUmbral),p=num(c.itfPct);return (monto>(u==null?1000:u))?Math.round(monto*((p==null?0.005:p)/100)*100)/100:0};

function computeB(){
  bSync();
  const B=S.b,cfg=B.cfg,si=num(cfg.saldoInicial)||0;
  const movs=B.mov.map(m=>({...m,_m:num(m.monto)||0}))
    .sort((a,b)=>cmpTxt(a.fecha,b.fecha)||((num(a.ts)||0)-(num(b.ts)||0))||cmpTxt(a.id,b.id));
  let saldo=si,ing=0,egr=0;const porMes={},porTipo={};
  movs.forEach((m,i)=>{
    m._i=i+1;m._cod='M-'+String(i+1).padStart(4,'0');
    const ent=m.dir==='I';
    if(ent){saldo+=m._m;ing+=m._m}else{saldo-=m._m;egr+=m._m}
    m._saldo=Math.round(saldo*100)/100;
    const k=(m.fecha||'').slice(0,7);
    if(k){const o=porMes[k]=porMes[k]||{ing:0,egr:0,saldo:0,n:0};if(ent)o.ing+=m._m;else o.egr+=m._m;o.saldo=m._saldo;o.n++}
    if(!ent){const t=m.tipoOp||'OTRO';porTipo[t]=(porTipo[t]||0)+m._m}
  });
  const meses=Object.keys(porMes).sort();
  const tipos=Object.keys(porTipo).map(k=>({n:k,v:porTipo[k]})).sort((a,b)=>b.v-a.v);
  const sc=movs.filter(sinComp);
  const T={ing,egr,saldo:Math.round(saldo*100)/100,si,n:movs.length,sc:sc.length,scMonto:sc.reduce((a,m)=>a+m._m,0)};
  // conciliación: saldo del libro a la fecha del estado de cuenta
  const fe=cfg.fechaEstado,se=num(cfg.saldoEstado);
  let libro=si;movs.forEach(m=>{if(!fe||m.fecha<=fe)libro+=(m.dir==='I'?m._m:-m._m)});
  libro=Math.round(libro*100)/100;
  const dif=se==null?null:Math.round((libro-se)*100)/100;
  const terc={};movs.forEach(m=>{if(m.tercDoc&&m.tercNombre)terc[String(m.tercDoc).trim()]=m.tercNombre});
  const BC={movs,meses,porMes,tipos,T,libro,se,dif,fe,terc,cj:computeCaja()};
  BC.alerts=alertsB(BC);
  return BC;
}

function alertsB(BC){
  const X=[],add=(sev,t,d,go)=>X.push({sev,t,d,go}),cfg=S.b.cfg,today=hoy();
  const dup={};BC.movs.forEach(m=>{const k=[m.fecha,m.dir,m._m,String(m.nroOp||'').trim()].join('|');(dup[k]=dup[k]||[]).push(m.id)});
  BC.movs.forEach(m=>{
    const ref=(m.dir==='I'?'Ingreso':'Egreso')+' '+m._cod+' del '+fdate(m.fecha)+' ('+bm(m._m)+')';
    const go={edit:m.id};
    if(m.tipoOp&&String(m.nroOp||'').trim()===''&&!BEXENTO.includes(m.tipoOp))add('m',ref+': falta el número de operación','',go);
    else if(String(m.nroOp||'').trim()&&dup[[m.fecha,m.dir,m._m,String(m.nroOp).trim()].join('|')].length>1)add('a',ref+': posible duplicado','Hay otro movimiento con la misma fecha, importe y número de operación.',go);
    if(sinComp(m))add(m.dir==='E'?'a':'m',ref+': sin comprobante','Indica el tipo y la serie-número del documento que sustenta el movimiento.',go);
    else if(String(m.docTipo||'').trim()&&!String(m.docSerie||'').trim())add('m',ref+': falta la serie y número del comprobante','',go);
    if(!BEXENTO.includes(m.tipoOp)){
      if(!String(m.tercNombre||'').trim())add('m',ref+': falta el cliente, proveedor o trabajador','',go);
      else if(m.tercDoc&&!validDoc(m.tercDoc))add('m',ref+': DNI o RUC no válido','',go);
    }
    if(m._saldo<0)add('a',ref+': deja el saldo en negativo ('+bm(m._saldo)+')','Revisa el saldo inicial o las fechas de los movimientos.',go);
    if(m.fecha>today)add('m',ref+': la fecha es futura','',go);
    if(cfg.fechaInicial&&m.fecha<cfg.fechaInicial)add('m',ref+': es anterior a la fecha del saldo inicial','',go);
  });
  const byDay={};BC.movs.forEach(m=>{(byDay[m.fecha]=byDay[m.fecha]||{itf:0,base:0,n:0});const o=byDay[m.fecha];
    if(m.tipoOp==='ITF'){o.itf+=m._m;o.n++}else if(m.dir==='E')o.base+=itfCalc(m._m)});
  Object.keys(byDay).forEach(f=>{const o=byDay[f];if(o.n&&Math.abs(o.itf-o.base)>0.1)add('b','ITF del '+fdate(f)+': registrado '+bm(o.itf)+', estimado '+bm(o.base),'Compara con el estado de cuenta; el ITF se cobra sobre los cargos mayores al umbral.',{tab:'movimientos'})});
  if(BC.se==null)add('b','Falta el saldo según el estado de cuenta','Regístralo en la pestaña Conciliación para comprobar que el saldo cuadra.',{tab:'conciliacion'});
  else if(BC.dif!==0)add('c','El saldo no concilia: diferencia de '+bm(BC.dif),'Saldo del libro '+bm(BC.libro)+' contra estado de cuenta '+bm(BC.se)+' al '+fdate(BC.fe||hoy())+'.',{tab:'conciliacion'});
  if(!String(cfg.cuenta||'').trim()||!String(cfg.empresa||'').trim())add('b','Faltan los datos de la cuenta','Completa empresa, RUC y número de cuenta en Ajustes para que salgan en el Excel.',{settings:true});
  BC.cj.movs.forEach(m=>{const ref='Caja chica del '+fdate(m.fecha)+' ('+bm(m._m)+')';
    if(!String(m.docTipo||'').trim())add('m',ref+': sin comprobante','Indica el tipo y la serie-número del documento que sustenta el gasto.',{tab:'caja'});
    if(m._saldo<0)add('a',ref+': deja la caja chica en negativo ('+bm(m._saldo)+')','Revisa el saldo inicial de caja o los ingresos de reposición.',{tab:'caja'});
  });
  X.sort((a,b)=>SEV[a.sev].o-SEV[b.sev].o);
  return X;
}

function bResumen(){
  const BC=S.BC,T=BC.T;
  if(!BC.movs.length)return bEmpty();
  const dif=BC.dif;
  const kpis=`<div class="kpis">
   <div class="kpi"><span class="l">Saldo inicial</span><span class="v" style="font-size:1.25rem">${bm(T.si)}</span><span class="s">${S.b.cfg.fechaInicial?'al '+fdate(S.b.cfg.fechaInicial):'del periodo'}</span></div>

   <div class="kpi"><span class="l">Egresos</span><span class="v" style="font-size:1.25rem">${bm(T.egr)}</span><span class="s">${BC.movs.filter(m=>m.dir==='E').length} movimientos</span></div>
   <div class="kpi"><span class="l">Saldo final</span><span class="v" style="font-size:1.25rem;color:${T.saldo<0?'var(--bad)':'inherit'}">${bm(T.saldo)}</span><span class="s">calculado</span></div>

function bCalidad(){
  const BC=S.BC;
  if(!BC.alerts.length)return '<div class="empty"><b>Todo en orden</b><span>El saldo concilia y los movimientos están sustentados.</span></div>';
  const counts={};BC.alerts.forEach(a=>counts[a.sev]=(counts[a.sev]||0)+1);
  const sum=Object.keys(SEV).filter(k=>counts[k]).map(k=>`<span class="pill ${k}">${SEV[k].n}: ${counts[k]}</span>`).join(' ');
  let html=`<div class="toolbar"><div class="grp">${sum}</div><span class="hint">Se recalcula solo cada vez que cambias un dato.</span></div><div class="alerts">`,cur='';
  BC.alerts.forEach((a,i)=>{
    if(a.sev!==cur){cur=a.sev;html+=`<div class="sevhead">${SEV[a.sev].n}</div>`}
    html+=`<div class="alert"><span class="pill ${a.sev}">${SEV[a.sev].n}</span><div><b>${esc(a.t)}</b>${a.d?`<span class="d">${esc(a.d)}</span>`:''}</div><button class="btn sm" data-act="b-go" data-i="${i}">Revisar</button></div>`;
  });
  return html+'</div>';
}

function updatePreviewB(){
  const box=$('#bm-prev');if(!box)return;
  const f=$('#mf'),id=f.dataset.id,prev=id?S.b.mov.find(x=>x.id===id):null;
  const monto=num(gv('bm-monto')),dir=gv('bm-dir'),op=gv('bm-op');
  const w=$('#w-itf');
  if(!(monto>0)){box.innerHTML='<span class="hint">Escribe el importe para ver el saldo resultante.</span>';if(w)w.hidden=true;return}
  const base=num(S.b.cfg.saldoInicial)||0;
  let saldoSin=base;S.BC.movs.forEach(m=>{if(prev&&m.id===prev.id)return;saldoSin+=m.dir==='I'?m._m:-m._m});
  const des=saldoSin+(dir==='I'?monto:-monto);
  let h=`<div>Saldo después de este movimiento: <b class="mono" style="${des<0?'color:var(--bad)':''}">${bm(des)}</b> <span class="hint">(si es el último)</span></div>`;

  const id=b.dataset.id;

  if(a==='b-edit'){openMovB(id);return}
  if(a==='b-settings'){openSettingsB();return}

function bChangeIn(t,k){
  const B=S.b;

  if(k==='bfdir'){B.fdir=t.value;render();return}

/* ---------- navegación ---------- */
function setRoute(mod,tab){
  S.mod=mod;if(tab)S.tab=tab;
  if(mod==='kardex'){if(tab)S.k.tab=tab}
  if(mod==='alquileres'){if(tab)S.a.tab=tab}
  if(mod==='banco'){if(tab)S.b.tab=tab}
  const h=mod==='proyectos'?mod+'-'+S.tab:mod==='kardex'?mod+'-'+S.k.tab:mod==='alquileres'?mod+'-'+S.a.tab:mod==='banco'?mod+'-'+S.b.tab:mod;
  if(location.hash.slice(1)!==h)location.hash=h;
  render();
}
function readHash(){
  const h=location.hash.slice(1);if(!h)return;
  const [m,t]=h.split('-');
  if(MODULES.some(x=>x.id===m))S.mod=m;
  if(t&&m==='proyectos'&&TABS.some(x=>x[0]===t))S.tab=t;
  if(t&&m==='kardex'&&KTABS.some(x=>x[0]===t))S.k.tab=t;
  if(t&&m==='alquileres'&&ATABS.some(x=>x[0]===t))S.a.tab=t;
  if(t&&m==='banco'&&BTABS.some(x=>x[0]===t))S.b.tab=t;
}

let lastFocus=null;
function cardTables(){
  document.querySelectorAll('#main table').forEach(t=>{
    if(!t.querySelector('tbody td.act'))return;
    t.classList.add('rec');
    const hs=[...t.querySelectorAll('thead th')].map(h=>h.textContent.trim());
    t.querySelectorAll('tbody tr').forEach(tr=>{const c=[...tr.children];if(c.length!==hs.length)return;c.forEach((td,i)=>{if(hs[i])td.setAttribute('data-l',hs[i])})});
  });
}
function render(){
  const a=document.activeElement;lastFocus=a&&a.dataset&&a.dataset.fk?a.dataset.fk:null;
  S.C=compute();S.KC=computeK();S.AC=computeA();S.BC=computeB();
  renderSide();
  const main=$('#main');
  if(S.mod==='proyectos')main.innerHTML=viewProyectos();else if(S.mod==='kardex')main.innerHTML=viewKardex();else if(S.mod==='alquileres')main.innerHTML=viewAlq();else if(S.mod==='banco')main.innerHTML=viewBanco();else main.innerHTML=viewPending(MODULES.find(m=>m.id===S.mod));
  cardTables();
  if(lastFocus){const el=main.querySelector('[data-fk="'+lastFocus+'"]');if(el){el.focus();try{if(el.type==='text'||el.type==='search'){const n=el.value.length;el.setSelectionRange(n,n)}else el.select()}catch(e){}}}
}

function monthsInRange(d,h){
  const out=[];let y=+d.slice(0,4),m=+d.slice(5,7);const ye=+h.slice(0,4),me=+h.slice(5,7);
  while((y<ye||(y===ye&&m<=me))&&out.length<36){out.push({k:y+'-'+String(m).padStart(2,'0'),l:MES[m-1]+(out.length&&m!==1?'':' '+String(y).slice(2))});m++;if(m>12){m=1;y++}}
  return out;
}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));for(const c of [1,2,2.5,5,10]){if(c*p>=v)return c*p}return 10*p}
function chartMeses(C){
  const months=monthsInRange(S.cfg.periodoDesde,S.cfg.periodoHasta);
  const vals=months.map(m=>C.porMes[m.k]||0);
  const max=Math.max(...vals,0);
  if(!months.length)return '';
  const top=max>0?niceMax(max):1;
  const W=520,H=240,pl=56,pr=8,pt=26,pb=34,pw=W-pl-pr,ph=H-pt-pb,n=months.length,step=pw/n,bw=Math.min(40,step*.56);
  const sc=v=>pt+ph-(v/top)*ph;
  const tick=v=>v>=1000?nf(v/1000)+' mil':nf(v);
  let g='';
  [0,top/2,top].forEach(t=>{const y=sc(t);g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="ax" x="${pl-8}" y="${y+4}" text-anchor="end">${max>0?tick(t):''}</text>`});
  months.forEach((m,i)=>{
    const v=vals[i],cx=pl+step*i+step/2,x=cx-bw/2;
    g+=`<text class="ax" x="${cx}" y="${H-12}" text-anchor="middle">${m.l}</text>`;
    if(v>0){const h=ph*(v/top),y=sc(v),r=Math.min(4,bw/2,h);
      g+=`<g><title>${m.l}: ${money(v)}</title><path class="bar" d="M${x},${y+h}L${x},${y+r}Q${x},${y} ${x+r},${y}L${x+bw-r},${y}Q${x+bw},${y} ${x+bw},${y+r}L${x+bw},${y+h}Z"/></g><text class="val" x="${cx}" y="${y-6}" text-anchor="middle">${nf(v)}</text>`;
    }else g+=`<text class="val" x="${cx}" y="${pt+ph-6}" text-anchor="middle" style="opacity:.55">-</text>`;
  });
  g+=`<line class="base" x1="${pl}" x2="${W-pr}" y1="${pt+ph}" y2="${pt+ph}"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Importe de escrituras por mes, total ${money(C.T.escImp)}">${g}</svg>
  <p class="hint" style="margin:6px 0 0">Un guion significa que ese mes no tuvo escrituras.</p>`;
}

  const foot=`<tr><td>Totales</td><td class="n">${nf(C.T.total)}</td><td class="n">${nf(C.T.vend)}</td><td class="n">${nf(C.T.pend)}</td><td class="n">${nf(C.T.avance*100,1)}%</td><td></td></tr>`;

/* ----- Control de calidad ----- */
function tCalidad(){
  const C=S.C;
  if(!S.proyectos.length)return emptyProy();
  if(!C.alerts.length)return '<div class="empty"><b>Todo en orden</b><span>Los totales cuadran y no hay datos pendientes.</span></div>';
  const counts={};C.alerts.forEach(a=>counts[a.sev]=(counts[a.sev]||0)+1);
  const sum=Object.keys(SEV).filter(k=>counts[k]).map(k=>`<span class="pill ${k}">${SEV[k].n}: ${counts[k]}</span>`).join(' ');
  let html=`<div class="toolbar"><div class="grp">${sum}</div><span class="hint">Se recalcula solo cada vez que cambias un dato.</span></div><div class="alerts">`;
  let cur='';
  C.alerts.forEach((a,i)=>{
    if(a.sev!==cur){cur=a.sev;html+=`<div class="sevhead">${SEV[a.sev].n}</div>`}
    html+=`<div class="alert"><span class="pill ${a.sev}">${SEV[a.sev].n}</span><div><b>${esc(a.t)}</b>${a.d?`<span class="d">${esc(a.d)}</span>`:''}</div><button class="btn sm" data-act="go" data-i="${i}">Revisar</button></div>`;
  });

}

function loteCtl(pid,cur,exceptId){
  const p=pid?S.C.projById[pid]:null;
  if(!p)return `<select id="e-lotes" disabled><option value="">Primero elige el proyecto</option></select>`;
  const det=ldet(p),ck=cur&&cur.l?lkey(cur.t,cur.z,cur.l):'';
  if(!det.length){
    if(ck)return `<select id="e-lotes"><option value="${esc(ck)}" selected>${esc((cur.z?zLbl(cur.t,cur.z)+' · ':'')+'Lote '+cur.l)} (el proyecto aún no tiene lista de lotes)</option></select>`;
    return `<div id="e-lotes-none" class="note warn">Este proyecto aún no tiene sus lotes registrados. <button type="button" class="btn sm" data-act="e-reg-lotes" data-id="${p.id}">Registrar lotes del proyecto</button></div>`;
  }
  const used=new Set();
  S.C.esc.forEach(e=>{if(e.id!==exceptId&&e.proyectoId===pid)(e._l||[]).forEach(l=>used.add(lkey(zonaTipo(e),e.mz,l)))});
  const g=new Map();det.forEach(d=>{const k=d.z?d.t+'|'+d.z:'';if(!g.has(k))g.set(k,{t:d.t,z:d.z,l:[]});g.get(k).l.push(d)});
  let h='<option value="">Elige el lote</option>';
  g.forEach(o=>{h+=`<optgroup label="${esc(zLbl(o.t,o.z))}">`+o.l.map(d=>{const k=lkey(d.t,d.z,d.l),u=used.has(k);return `<option value="${esc(k)}" ${u?'disabled':''} ${k===ck&&!u?'selected':''}>Lote ${esc(d.l)}${u?' · ya vendido':''}</option>`}).join('')+'</optgroup>'});
  if(ck&&!det.some(d=>lkey(d.t,d.z,d.l)===ck))h+=`<option value="${esc(ck)}" selected>${esc((cur.z?zLbl(cur.t,cur.z)+' · ':'')+'Lote '+cur.l)} (no está en la lista del proyecto)</option>`;
  return `<select id="e-lotes">${h}</select>`;
}

function serial(iso){if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||''))return '';const [y,m,d]=iso.split('-').map(Number);return (Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/86400000}

const stamp=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function newSheet(name,o){return Object.assign({name,rows:[],merges:[],heights:{},cols:[],validations:[]},o||{})}
function put(sh,r,c,v,s){ // r y c empiezan en 1
  const row=(sh.rows[r-1]=sh.rows[r-1]||[]);
  row[c-1]=(v&&typeof v==='object'&&!(v instanceof Date))?{...v,s:{...(s||{}),...(v.s||{})}}:{v,s};
}
function box(sh,r1,c1,r2,c2,s){for(let r=r1;r<=r2;r++){const row=(sh.rows[r-1]=sh.rows[r-1]||[]);for(let c=c1;c<=c2;c++)if(row[c-1]==null)row[c-1]={v:null,s}}}
function merge(sh,r1,c1,r2,c2,s){if(s)box(sh,r1,c1,r2,c2,s);sh.merges.push(XLX.colL(c1-1)+r1+':'+XLX.colL(c2-1)+r2)}

  if(!window.JSZip){toast('No se pudo cargar el generador de Excel.');return}
  try{
    const data=await XLX.build(sheets,window.JSZip);
    await DL.save({filename,data:new Blob([data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})});
    toast('Archivo listo');
  }catch(e){toast('No se pudo generar el archivo.')}
}
const SEVFILL={c:'F4CCCC',a:'FCE4D6',m:'FFF2CC',b:'DDEBF7',i:'EDEDED'};
function sheetCalidad(alerts,head,hfont,body){
  const sh=newSheet('Control de calidad',{hideGrid:true,cols:[14,80,100],landscape:true});
