const tMesDif=(a,b)=>{const [y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return (y2-y1)*12+(m2-m1)};
const tMesMas=(mes,k)=>{const [y,m]=mes.split('-').map(Number),d=new Date(y,m-1+k,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
function tPreCron(x){
  const n=Math.max(1,Math.round(num(x.cuotas)||1)),monto=num(x.monto)||0,c=r2(monto/n);
  return [...Array(n)].map((_,i)=>({n:i+1,mes:tMesMas(x.primerMes,i),monto:i===n-1?r2(monto-c*(n-1)):c}));
}
function tPreCuota(x,mes){if(!x.primerMes||!/^\d{4}-\d{2}$/.test(x.primerMes))return null;const i=tMesDif(x.primerMes,mes),cr=tPreCron(x);return i>=0&&i<cr.length?cr[i]:null}
function tPreSaldo(x,mes){return r2(tPreCron(x).filter(c=>c.mes>mes).reduce((a,c)=>a+c.monto,0))}
function tPre(M){
  const L=[...tPreList()].sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha))||cmpTxt(a.name,b.name));
  const bar=`<div class="toolbar"><div class="grp"><button class="btn primary" data-act="tp-new">Registrar préstamo</button></div></div>`;
  if(!L.length)return bar+`<div class="empty"><b>Aún no hay préstamos registrados</b><span>Registra el monto, las cuotas y el mes de la primera cuota. Cada mes la cuota se descuenta sola en Planilla.</span></div>`;
  const rows=L.map(x=>{const c=tPreCuota(x,S.t.month),sd=tPreSaldo(x,S.t.month);
    return `<tr><td class="n">${fdate(x.fecha)}</td><td class="wrap">${esc(x.name||'')}</td><td class="n">${money(num(x.monto)||0,'PEN',2)}</td><td class="n">${esc(x.cuotas||'')}</td><td class="n">${x.primerMes?esc(tMonthTxt(x.primerMes)):''}</td>
    <td class="n">${c?money(c.monto,'PEN',2)+' <span class="small">('+c.n+'/'+tPreCron(x).length+')</span>':'—'}</td><td class="n">${money(sd,'PEN',2)}</td><td class="act">${detBtn('tp',x.id)}</td></tr>`}).join('');
  const tc=r2(L.reduce((a,x)=>{const c=tPreCuota(x,S.t.month);return a+(c?c.monto:0)},0));
  return bar+`<div class="card"><h2>Préstamos</h2><div class="scroll"><table data-nofit="1"><thead><tr><th class="n">Fecha</th><th>Colaborador</th><th class="n">Monto</th><th class="n">Cuotas</th><th class="n">Primera cuota</th><th class="n">Cuota de ${esc(tMonthTxt(S.t.month))}</th><th class="n">Saldo al cierre del mes</th><th></th></tr></thead><tbody>${rows}</tbody>
  <tfoot><tr><td colspan="5">Cuotas a descontar en ${esc(tMonthTxt(S.t.month))}</td><td class="n">${money(tc,'PEN',2)}</td><td></td><td></td></tr></tfoot></table></div>
  <p class="hint" style="margin:8px 0 0">Cuotas iguales (la última absorbe el redondeo), una por mes desde el mes de la primera cuota. La cuota del mes se descuenta en la columna Préstamos de Planilla.</p></div>`;
}

function setRoute(mod,tab){
  S.mod=mod;if(tab)S.tab=tab;
  if(mod==='kardex'){if(tab)S.k.tab=tab}
  if(mod==='alquileres'){if(tab)S.a.tab=tab}
  if(mod==='banco'){if(tab)S.b.tab=tab}
  if(mod==='tareo'){if(tab)S.t.tab=tab}
  const h=mod==='proyectos'?mod+'-'+S.tab:mod==='kardex'?mod+'-'+S.k.tab:mod==='alquileres'?mod+'-'+S.a.tab:mod==='banco'?mod+'-'+S.b.tab:mod==='tareo'?mod+'-'+S.t.tab:mod;
  if(location.hash.slice(1)!==h)location.hash=h;
  render();
}
function readHash(){
  const h=location.hash.slice(1);if(!h)return;
  const [m,t]=h.split('-');
  if(MODULES.some(x=>x.id===m))S.mod=m;
  if(t&&m==='proyectos'&&TABS.some(x=>x[0]===t))S.tab=t;
  if(t&&m==='kardex'&&KTABS.some(x=>x[0]===t))S.k.tab=t;
  if(t&&m==='alquileres'&&ATABS.some(x=>x[0]===t))S.a.tab=t;
  if(t&&m==='banco'&&BTABS.some(x=>x[0]===t))S.b.tab=t;
  if(t&&m==='tareo'&&TTABS.some(x=>x[0]===t))S.t.tab=t;
}

const COL_LOW=/observ|detalle|tipo|marca|moneda|unidad|modalidad|serie|dni|ruc|referencia|periodo|comprobante|estado|modo|forma/i;
const COL_HIGH=/apellidos|fecha|importe|ingreso|egreso|saldo|renta|stock|total|valor|avance|vendid|pendient|descripci|producto|arrendador|documento|cliente|proveedor/i;
function fitTables(){
  document.querySelectorAll('#main table').forEach(t=>{
    t.querySelectorAll('.chid').forEach(x=>x.classList.remove('chid'));
    const sc=t.closest('.scroll');if(!sc||t.dataset.nofit||getComputedStyle(t).display!=='table')return;
    const ths=[...t.querySelectorAll('thead tr:last-child th')],n=ths.length,mn=Number(t.dataset.min)||3;if(n<4)return;
    const fr=t.querySelector('tbody tr'),hasAct=!!(fr&&fr.children.length===n&&fr.children[n-1].classList.contains('act'));
    const cand=[];for(let i=(t.dataset.min?0:2);i<(hasAct?n-1:n);i++)cand.push(i);
    const tx=i=>ths[i].textContent,tier=i=>ths[i].dataset.p!=null?Number(ths[i].dataset.p):ths[i].dataset.lo?0:COL_HIGH.test(tx(i))?3:COL_LOW.test(tx(i))?1:2;
    const order=[0,1,2,3].flatMap(k=>cand.filter(i=>tier(i)===k).reverse());
    t.classList.remove('tight');
    let vis=n-(hasAct?1:0);
    for(const i of order){
      if(sc.scrollWidth<=sc.clientWidth+1||vis<=mn)break;
      t.querySelectorAll('tr').forEach(tr=>{if(tr.children.length===n)tr.children[i].classList.add('chid')});vis--;

function monthsInRange(d,h){
  const out=[];let y=+d.slice(0,4),m=+d.slice(5,7);const ye=+h.slice(0,4),me=+h.slice(5,7);
  while((y<ye||(y===ye&&m<=me))&&out.length<36){out.push({k:y+'-'+String(m).padStart(2,'0'),l:MES[m-1]+(out.length&&m!==1?'':' '+String(y).slice(2))});m++;if(m>12){m=1;y++}}
  return out;
}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));for(const c of [1,2,2.5,5,10]){if(c*p>=v)return c*p}return 10*p}
function chartMeses(C){
  const months=monthsInRange(S.cfg.periodoDesde,S.cfg.periodoHasta);
  const vals=months.map(m=>C.porMes[m.k]||0);
  const max=Math.max(...vals,0);
  if(!months.length)return '';
  const top=max>0?niceMax(max):1;
  const W=520,H=240,pl=56,pr=8,pt=26,pb=34,pw=W-pl-pr,ph=H-pt-pb,n=months.length,step=pw/n,bw=Math.min(40,step*.56);
  const sc=v=>pt+ph-(v/top)*ph;
  const tick=v=>v>=1000?nf(v/1000)+' mil':nf(v);
  let g='';
  [0,top/2,top].forEach(t=>{const y=sc(t);g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="ax" x="${pl-8}" y="${y+4}" text-anchor="end">${max>0?tick(t):''}</text>`});
  months.forEach((m,i)=>{
    const v=vals[i],cx=pl+step*i+step/2,x=cx-bw/2;
    g+=`<text class="ax" x="${cx}" y="${H-12}" text-anchor="middle">${m.l}</text>`;
    if(v>0){const h=ph*(v/top),y=sc(v),r=Math.min(4,bw/2,h);
      g+=`<g><title>${m.l}: ${money(v)}</title><path class="bar" d="M${x},${y+h}L${x},${y+r}Q${x},${y} ${x+r},${y}L${x+bw-r},${y}Q${x+bw},${y} ${x+bw},${y+r}L${x+bw},${y+h}Z"/></g><text class="val" x="${cx}" y="${y-6}" text-anchor="middle">${nf(v)}</text>`;
    }else g+=`<text class="val" x="${cx}" y="${pt+ph-6}" text-anchor="middle" style="opacity:.55">-</text>`;
  });
  g+=`<line class="base" x1="${pl}" x2="${W-pr}" y1="${pt+ph}" y2="${pt+ph}"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Importe de escrituras por mes, total ${money(C.T.escImp)}">${g}</svg>
  <p class="hint" style="margin:6px 0 0">Un guion significa que ese mes no tuvo escrituras.</p>`;
}

  let html=`<div class="toolbar"><div class="grp">${sum}</div><span class="hint">Se recalcula solo cada vez que cambias un dato.</span></div><div class="alerts">`;
  let cur='';
  C.alerts.forEach((a,i)=>{
    if(a.sev!==cur){cur=a.sev;html+=`<div class="sevhead">${SEV[a.sev].n}</div>`}
    html+=`<div class="alert"><span class="pill ${a.sev}">${SEV[a.sev].n}</span><div><b>${esc(a.t)}</b>${a.d?`<span class="d">${esc(a.d)}</span>`:''}</div><button class="btn sm" data-act="go" data-i="${i}">Revisar</button></div>`;
  });
  return html+'</div>';
}

  el.className='small '+(ok?'':'warn');el.style.color=ok?'var(--ok)':'';
  el.textContent=(ok?'✔ ':'')+n+' de '+tot+' lotes registrados'+(n&&!ok&&tot?' · faltan '+Math.max(0,tot-n):'');
  const b=document.querySelector('[data-act=p-lotes]');if(b)b.textContent=n?'Ver o editar lotes':'Registrar lotes';

function lotRanges(nums){
  const a=nums.map(Number).filter(Number.isFinite).sort((x,y)=>x-y),out=[];let i=0;
  while(i<a.length){let j=i;while(j+1<a.length&&a[j+1]===a[j]+1)j++;out.push(j>i?a[i]+'–'+a[j]:String(a[i]));i=j+1}
  return out.join(', ');
}

function renderLotesEd(){
  const L=S.pLotes||[],tot=num(gv('p-lotesTotal'))||0;
  const st=$('#lot-st');if(!st)return;
  st.innerHTML=`<b>${L.length}</b> de <b>${tot}</b> lotes registrados${L.length<tot?' · faltan <b>'+(tot-L.length)+'</b>':(L.length===tot&&tot?' · <b style="color:var(--ok)">completo</b>':'')}`;
  const g=new Map();L.forEach(x=>{const k=x.z?x.t+'|'+x.z:'';if(!g.has(k))g.set(k,{t:x.t,z:x.z,l:[]});g.get(k).l.push(x.l)});
  $('#lot-list').innerHTML=g.size?[...g.entries()].map(([k,o])=>`<div class="lotgrp"><div><b>${esc(zLbl(o.t,o.z))}</b><div class="rg">Lotes ${esc(lotRanges(o.l))} · ${o.l.length} lote${o.l.length>1?'s':''}</div></div><button type="button" class="btn sm" data-act="lot-del" data-g="${esc(k)}">Quitar</button></div>`).join(''):'<p class="hint">Aún no has registrado lotes.</p>';

function lotAdd(){
  const err=m=>{$('#lot-err').textContent=m||''};err('');
  const t=$('#lot-tipo').value,z=t?$('#lot-z').value.trim().toUpperCase().replace(/\|/g,''):'',d=num($('#lot-d').value);let h=num($('#lot-h').value);if(h==null)h=d;
  const tot=num(gv('p-lotesTotal'))||0;
  if(!tot){err('Primero escribe los lotes totales del proyecto.');return}
  if(t&&!z){err('Escribe el identificador de la '+t.toLowerCase()+'.');return}
  if(!(d>=1)||!Number.isInteger(d)){err('Indica el número del primer lote.');return}
  if(!(h>=d)||!Number.isInteger(h)){err('El lote final debe ser igual o mayor que el inicial.');return}
  const nu=[];for(let i=d;i<=h;i++)nu.push({t:z?t:'',z,l:String(i)});
  const dup=nu.filter(n=>S.pLotes.some(x=>lkey(x.t,x.z,x.l)===lkey(n.t,n.z,n.l)));
  if(dup.length){err('Ya están registrados en '+zLbl(t,z).toLowerCase()+': lotes '+lotRanges(dup.map(x=>x.l))+'.');return}
  if(S.pLotes.length+nu.length>tot){err('Con estos lotes pasarías el total de '+tot+'. Te quedan '+Math.max(0,tot-S.pLotes.length)+' por registrar.');return}
  S.pLotes.push(...nu);lotSort(S.pLotes);$('#lot-d').value='';$('#lot-h').value='';renderLotesEd();updateLotesSt();$('#lot-d').focus();
}
function lotDel(k){
  const pid=$('#mf').dataset.id;
  const sold=pid?S.C.esc.filter(e=>e.proyectoId===pid&&(e.mz?zonaTipo(e)+'|'+String(e.mz).trim().toUpperCase():'')===k).flatMap(e=>e._l.map(String)):[];
  const mine=S.pLotes.filter(x=>(x.z?x.t+'|'+x.z:'')===k);
  const bloq=mine.filter(x=>sold.includes(String(x.l)));
  if(bloq.length){$('#lot-err').textContent='No se puede quitar: los lotes '+lotRanges(bloq.map(x=>x.l))+' ya tienen escritura registrada.';return}
  S.pLotes=S.pLotes.filter(x=>(x.z?x.t+'|'+x.z:'')!==k);$('#lot-err').textContent='';renderLotesEd();updateLotesSt();
}

function loteCtl(pid,cur,exceptId){
  const p=pid?S.C.projById[pid]:null;
  if(!p)return `<select id="e-lotes" disabled><option value="">Primero elige el proyecto</option></select>`;
  const det=ldet(p),ck=cur&&cur.l?lkey(cur.t,cur.z,cur.l):'';
  if(!det.length){
    if(ck)return `<select id="e-lotes"><option value="${esc(ck)}" selected>${esc((cur.z?zLbl(cur.t,cur.z)+' · ':'')+'Lote '+cur.l)} (el proyecto aún no tiene lista de lotes)</option></select>`;
    return `<div id="e-lotes-none" class="note warn">Este proyecto aún no tiene sus lotes registrados. <button type="button" class="btn sm" data-act="e-reg-lotes" data-id="${p.id}">Registrar lotes del proyecto</button></div>`;
  }
  const used=new Set();
  S.C.esc.forEach(e=>{if(e.id!==exceptId&&e.proyectoId===pid)(e._l||[]).forEach(l=>used.add(lkey(zonaTipo(e),e.mz,l)))});
  const g=new Map();det.forEach(d=>{const k=d.z?d.t+'|'+d.z:'';if(!g.has(k))g.set(k,{t:d.t,z:d.z,l:[]});g.get(k).l.push(d)});
  let h='<option value="">Elige el lote</option>';
  g.forEach(o=>{h+=`<optgroup label="${esc(zLbl(o.t,o.z))}">`+o.l.map(d=>{const k=lkey(d.t,d.z,d.l),u=used.has(k);return `<option value="${esc(k)}" ${u?'disabled':''} ${k===ck&&!u?'selected':''}>Lote ${esc(d.l)}${u?' · ya vendido':''}</option>`}).join('')+'</optgroup>'});
  if(ck&&!det.some(d=>lkey(d.t,d.z,d.l)===ck))h+=`<option value="${esc(ck)}" selected>${esc((cur.z?zLbl(cur.t,cur.z)+' · ':'')+'Lote '+cur.l)} (no está en la lista del proyecto)</option>`;
  return `<select id="e-lotes">${h}</select>`;
}

function serial(iso){if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||''))return '';const [y,m,d]=iso.split('-').map(Number);return (Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/86400000}

function box(sh,r1,c1,r2,c2,s){for(let r=r1;r<=r2;r++){const row=(sh.rows[r-1]=sh.rows[r-1]||[]);for(let c=c1;c<=c2;c++)if(row[c-1]==null)row[c-1]={v:null,s}}}
function merge(sh,r1,c1,r2,c2,s){if(s)box(sh,r1,c1,r2,c2,s);sh.merges.push(XLX.colL(c1-1)+r1+':'+XLX.colL(c2-1)+r2)}

  if(ev.target.id!=='mf')return;ev.preventDefault();
  const k=ev.target.dataset.kind;
  if(k==='p')saveProyecto();else if(k==='e')saveEscritura();else if(k==='s')saveServicio();else if(k==='c')saveSettings();else if(k==='kp')saveProdK();else if(k==='km')saveMovK();else if(k==='kc')saveSettingsK();else if(k==='ac')saveContratoA();else if(k==='ap')savePagoA();else if(k==='ag')saveSettingsAq();else if(k==='bm')saveMovB();else if(k==='bj')saveMovJ();else if(k==='ta')saveAde();else if(k==='tp')savePre();else if(k==='tl')saveLic();else if(k==='tz')saveCierre();else if(k==='tr')saveReabrir();else if(k==='tf')saveFic();else if(k==='tc')saveCfgT();else if(k==='bg')saveSettingsB();
});
document.addEventListener('input',ev=>{
  const f=ev.target.closest&&ev.target.closest('#mf');
  if(f&&f.dataset.kind==='p'&&ev.target.id==='p-lotesTotal')updateLotesSt();
  if(f&&f.dataset.kind==='e'){if(ev.target.id==='e-proyecto')refreshLotes();updatePreview()}
  if(f&&f.dataset.kind==='km')kInput(ev);
  if(f&&f.dataset.kind==='ac')aInput(ev);
  if(f&&f.dataset.kind==='bm')bInput(ev);
  if(ev.target.dataset&&ev.target.dataset.actIn==='bfq')bChangeIn(ev.target,'bfq');
  if(ev.target.dataset&&ev.target.dataset.actIn==='afq')aChangeIn(ev.target,'afq');
  if(ev.target.dataset&&ev.target.dataset.actIn==='kfq')kChangeIn(ev.target,'kfq');
});
document.addEventListener('change',ev=>{
  const t=ev.target,k=t.dataset&&t.dataset.actIn;
  if(t.closest&&t.closest('#mf')&&$('#mf').dataset.kind==='km'){kChange(ev);return}
  if(t.closest&&t.closest('#mf')&&$('#mf').dataset.kind==='ac'){aChange(ev);return}
  if(t.closest&&t.closest('#mf')&&$('#mf').dataset.kind==='bm'){bChange(ev);return}
  if(k==='tmes'){tSetMonth(t.value);return}
  if(k==='tdec'){S.t.dec=!!t.checked;render();return}
  if(k==='bfmes'||k==='bfdir'||k==='bfsin'||k==='bcfg'){bChangeIn(t,k);return}
  if(k==='kfprod'||k==='kftipo'){kChangeIn(t,k);return}
  if(k==='afvig'||k==='afcon'||k==='apg'){aChangeIn(t,k);return}
  if((t.id==='p-departamento'||t.id==='p-provincia')&&t.closest&&t.closest('#mf')){ubCascade(t.id);return}
  if(k==='fesc'){S.fEsc=t.value;render();return}
  if(k==='svcon'){Store.update(COLS.config,'proyectos',{serviciosAplica:t.checked}).catch(()=>toast('No se pudo guardar.'));return}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&document.getElementById('qpop')){closeQHelp();return}
  if(ev.key==='Escape'&&$('#ov2')){$('#modal2').innerHTML='';updateLotesSt();return}
  if(ev.key==='Escape'&&$('#ov')){closeModal();return}
  const t=ev.target;
  if(t&&t.tagName==='INPUT'&&t.type==='number'&&!ev.ctrlKey&&!ev.metaKey&&!ev.altKey){
    if(ev.key==='ArrowUp'||ev.key==='ArrowDown'){ev.preventDefault();return}
    if(ev.key==='e'||ev.key==='E'||ev.key==='+')ev.preventDefault();
    if(ev.key==='-'&&t.min!==''&&Number(t.min)>=0)ev.preventDefault();
    if((ev.key==='.'||ev.key===',')&&t.step==='1')ev.preventDefault();
  }
});
document.addEventListener('wheel',ev=>{const t=document.activeElement;if(t&&t.tagName==='INPUT'&&t.type==='number'&&t===ev.target)t.blur()},{passive:true});
window.addEventListener('hashchange',()=>{readHash();render()});

/* ---------- arranque ---------- */
function mark(k){S.ready[k]=true;render()}
(async function start(){
  readHash();
  render();
  if(!(await checkAccess()))return;
  await Store.init();
  S.mode=Store.mode;
  S.canExport=true;
  const onErr=()=>{S.timeout=true;render()};
  Store.watch(COLS.proyectos,l=>{S.proyectos=l;mark('proyectos')},onErr);
  Store.watch(COLS.escrituras,l=>{S.escrituras=l;mark('escrituras')},onErr);
  Store.watch(COLS.servicios,l=>{S.servicios=l;mark('servicios')},onErr);
  Store.watch(COLS.config,l=>{const d=l.find(x=>x.id==='proyectos');S.cfg={...DEF_CFG,...(d||{})};mark('config')},onErr);
  Store.watch(KCOLS.cat,l=>{S.k.cat=l;S.k.ready.cat=true;render()},onErr);
  Store.watch(KCOLS.mov,l=>{S.k.mov=l;S.k.ready.mov=true;render()},onErr);
  Store.watch(KCOLS.cfg,l=>{const d=l.find(x=>x.id==='kardex');S.k.cfg={...KDEF,...(d||{})};S.k.ready.cfg=true;render()},onErr);
  Store.watch(ACOLS.con,l=>{S.a.con=l;S.a.ready.con=true;render()},onErr);
  Store.watch(ACOLS.pag,l=>{S.a.pag=l;S.a.ready.pag=true;render()},onErr);
  Store.watch(ACOLS.cfg,l=>{const d=l.find(x=>x.id==='alquileres');S.a.cfg={...ADEF,...(d||{})};S.a.ready.cfg=true;render()},onErr);
  Store.watch(BCOLS.mov,l=>{S.b.all=l;S.b.ready.mov=true;render()},onErr);
  Store.watch(BCOLS.caja,l=>{S.b.caja=l;S.b.ready.caja=true;render()},onErr);
  Store.watch(TCOLS.cie,l=>{S.t.cie=l;render()},onErr);
  Store.watch(TCOLS.pre,l=>{S.t.pre=l;render()},onErr);
  Store.watch(TCOLS.fic,l=>{S.t.fic=l;render()},onErr);
  Store.watch(TCOLS.vars,l=>{S.t.vars=l;render()},onErr);
  Store.watch(TCOLS.cfg,l=>{S.t.cfg=l.find(x=>x.id==='planilla')||null;render()},onErr);
  Store.watch(TCOLS.ade,l=>{S.t.ade=l;S.t.rAde=true;render()},onErr);
  Store.watch(BCOLS.cfg,l=>{S.b.cfgs=l;S.b.ready.cfg=true;render()},onErr);
  setTimeout(()=>{const r=S.ready;if(!(r.proyectos&&r.escrituras&&r.servicios&&r.config)){S.timeout=true;render()}},10000);
})();
})();
</script>
